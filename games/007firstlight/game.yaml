gdl: 1
version: 1.1.1   # extension version — drives info.json, the release tag, and the zip name

# 007: First Light (IO Interactive) — Glacier engine, modded via RPKG patch archives.
# Supports: .rpkg patches (→ Runtime/), loose DLL/INI/CFG overlays (→ Retail/), and
# whole-folder "root" mods.
#
# Note the shipping exe is NOT at the install root: executable/requiredFiles are
# Retail/007FirstLight.exe (these are literal relative paths — no glob expansion).
#
# Installer priorities run highest-first, and the three rules are mutually exclusive by
# construction: rpkg-patch (50) claims anything with a .rpkg; retail-overlay (30) takes
# loose dll/ini/cfg but `unless` a .rpkg is present; root (10) is the fallback for
# archives with none of those extensions.
#
# Corpus state: uploads on this game may postdate the June 2026 Nexus manifest outage, in
# which case `test:corpus --fetch` returns 404 and routes nothing while still exiting 0.
# Reconcile the summary's total against the real mod count before trusting a green run —
# see docs/corpus-manifests.md.

game:
  id: 007firstlight
  name: "007: First Light"
  executable: Retail/007FirstLight.exe
  requiredFiles:
    - Retail/007FirstLight.exe
  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: 007firstlight

stores:
  steam: 3768760

context:
  runtimeRoot: ${installPath}/Runtime

modTypes:
  - id: rpkg-patch
    name: RPKG Patch (Runtime)
    path: "${runtimeRoot}"

  - id: retail-overlay
    name: Retail Overlay
    path: "${installPath}/Retail"

  - id: root
    name: Root (game folder)
    path: "${installPath}"

installers:
  - id: rpkg-patch
    priority: 50
    when: { hasFile: "**/*.rpkg" }
    anchor: "**/*.rpkg"
    take: parent
    placeAt: "${runtimeRoot}"
    modType: rpkg-patch

  - id: retail-overlay
    priority: 30
    when:
      any:
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.ini" }
        - { hasFile: "**/*.cfg" }
    unless: { hasFile: "**/*.rpkg" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}/Retail"
    modType: retail-overlay

  - id: root
    priority: 10
    when: { hasFile: "**/*" }
    unless:
      any:
        - { hasFile: "**/*.rpkg" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.ini" }
        - { hasFile: "**/*.cfg" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: root

nexus:
  modId: 1918
  fileGroupId: 7465358
  displayName: 007 First Light Support for Vortex

tests:
  corpus: nexus
  cases:
    - name: rpkg patch file goes to Runtime
      archive:
        - chunk0patch1.rpkg
      expect:
        matched: rpkg-patch
        modType: rpkg-patch

    - name: rpkg patch in subfolder still lands in Runtime
      archive:
        - MyMod/chunk0patch2.rpkg
      expect:
        matched: rpkg-patch
        modType: rpkg-patch

    - name: dll overlay goes to Retail
      archive:
        - dinput8.dll
        - mods.ini
      expect:
        matched: retail-overlay
        modType: retail-overlay

    - name: generic files fall through to root
      archive:
        - readme.txt
        - docs/guide.pdf
      expect:
        matched: root
        modType: root
