gdl: 1
version: 2.1.0   # extension version — drives info.json, the release tag, and the zip name

# Gothic 1 Remake (Alkimia Interactive) — Unreal Engine 5. Project folder: G1R.
# Supports: pak mods (Content/Paks/~mods), UE4SS (loader + Lua mods), native Gothic mods,
# UE4SS injector repacks, and whole-folder "root" / project-relative "content-folder" mods.
#
# Two things to know before copying this as a template:
#   - discovery.version reads a plain-text file, no hook needed:
#     ${installPath}/G1R/Version/version.txt matched by /Build(\d+_CL\d+)/
#   - events.did-deploy DOES use src/hooks.ts (regenerateModsTxt) to rebuild the UE4SS
#     mods.txt load order after each deploy
# So this game has hooks AND file-based version discovery. Compare games/subnautica2,
# which needs a *hook* for version detection because its version file isn't plain UTF-8.

game:
  id: gothic1remake
  name: Gothic 1 Remake
  executable: G1R-Win64-Shipping.exe
  requiredFiles: [G1R-Win64-Shipping.exe]
  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: gothic1remake
  details:
    supportsSymlinks: true
    gameProjectFolder: G1R
    ignoreConflicts: [enabled.txt, mods.txt, UE4SS-settings.ini]
    ignoreDeploy: [mods.txt]

stores:
  steam: "1297900"

context:
  gamePath: ${installPath}/G1R
  pakModsPath: ${gamePath}/Content/Paks/~mods
  nativeModsPath: ${gamePath}/Mods
  ue4ssInjectorPath: ${gamePath}/Binaries/Win64
  ue4ssRootPath: ${gamePath}/Binaries/Win64/ue4ss
  ue4ssModsPath: ${gamePath}/Binaries/Win64/ue4ss/Mods

  # UE reads user config from %LOCALAPPDATA%, NOT the install dir. The leaf folder is
  # the UE *target platform* name and varies per game/build (Windows /
  # WindowsClient / WindowsNoEditor) — never copy another game's, and a wrong value
  # builds, tests and corpuses green while deploying into a folder the game ignores.
  # Verified from the install instructions of mods 68, 70, 71, 83 and 95, which
  # independently all document %LOCALAPPDATA%\G1R\Saved\Config\Windows.
  configPath: ${appDataLocal}/G1R/Saved/Config/Windows

modTypes:
  - id: gothic1remake-pak
    name: "Paks (~mods)"
    path: "${pakModsPath}"

  - id: gothic1remake-nativemod
    name: "Native Gothic Mod"
    path: "${nativeModsPath}"

  - id: gothic1remake-ue4ss
    name: "UE4SS Lua script"
    path: "${ue4ssModsPath}"

  - id: gothic1remake-ue4ss-injector
    name: "UE4SS Injector"
    path: "${ue4ssInjectorPath}"

  - id: gothic1remake-root
    name: "Root (game folder)"
    path: "${installPath}"

  - id: gothic1remake-contentfolder
    name: "Content folder"
    path: "${gamePath}"

  # Loose DLL plugins (upscalers, ReShade addons) live next to the shipping exe —
  # the same physical folder as the UE4SS loader, but a distinct id so the UI and
  # any future path split stay honest. Gothic is Steam-only, so no ${arch} branch.
  - id: gothic1remake-binaries
    name: "Binaries (DLL plugins)"
    path: "${ue4ssInjectorPath}"

  - id: gothic1remake-config
    name: "Config (Engine.ini tweaks)"
    path: "${configPath}"

installers:
  # --- Native Gothic Mods (GothicMod.json manifest) ---
  - id: native-gothic-mod
    priority: 10
    when: { hasFile: "**/GothicMod.json" }
    anchor: "**/GothicMod.json"
    take: parent.parent
    placeAt: "${nativeModsPath}"
    modType: gothic1remake-nativemod

  # --- UE4SS Injector (dwmapi.dll, xinput1_4.dll, UE4SS-settings.ini) ---
  # Support both layouts users can install:
  # - upstream UE4SS release: https://github.com/UE4SS-RE/RE-UE4SS/releases/tag/v3.0.1
  #   UE4SS_v3.0.1/
  #   ├── dwmapi.dll
  #   ├── UE4SS.dll
  #   └── UE4SS-settings.ini
  # - Nexus repack: https://www.nexusmods.com/gothic1remake/mods/3
  #   UE4SS-3-v3-0-1-326-g940af53-1740576953/
  #   └── G1R/
  #       └── Binaries/Win64/
  #           ├── dwmapi.dll
  #           ├── UE4SS.dll
  #           └── UE4SS-settings.ini
  # The repack rule anchors at Win64 and uses `take: self` so the copy destinations
  # are just the files below Win64 while keeping the same UE4SS Injector mod type.
  #
  # NOTE on the `unless` below: unlike the other UE games, this rule EXISTS to handle
  # game-relative archives (G1R/Binaries/Win64/…), so it must NOT decline them wholesale —
  # that would break the Nexus repack it was written for. Its `take: self` install root is
  # the Win64 folder, so it declines only when the archive ALSO carries payload outside
  # Binaries/ (paks, or a native Mods/ tree), which stripPath would silently drop. Those
  # archives fall through to `root` (16) / `content-folder` (17) and deploy intact.
  # See halocampaignevolved mod 68 for the same bug caught in the wild.
  - id: ue4ss-injector-repack
    priority: 14
    when: { hasFile: "**/Win64/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "**/Content/Paks/**" }
        - { hasFile: "**/Mods/**" }
    anchor: "**/Win64/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: self
    placeAt: "${ue4ssInjectorPath}"
    modType: gothic1remake-ue4ss-injector

  # Generic upstream UE4SS release: marker file parent is the install root.
  # `unless` guards the same drop hazard as the repack rule above, but here the fix is the
  # plain one used on the other UE games: `take: parent` resolves the install root to the
  # marker's folder, so a game-relative tree loses everything outside it. Decline and let
  # `root` (16) take it.
  - id: ue4ss-injector
    priority: 15
    when: { hasFile: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "G1R/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: parent
    placeAt: "${ue4ssInjectorPath}"
    modType: gothic1remake-ue4ss-injector

  # --- UE4SS Lua (Scripts/*.lua present) ---
  - id: ue4ss-lua
    priority: 22
    when: { hasFile: "**/Scripts/*.lua" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/Scripts/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: gothic1remake-ue4ss

  # --- Priority 23: UE4SS mod with enabled.txt but no Scripts/*.lua → ue4ss/Mods ---
  # UE4SS *C++* mods: a compiled dlls/main.dll plus enabled.txt instead of Lua.
  #   SuperArmorOverlay/{README.txt, dlls/main.dll, enabled.txt}       (mod 271)
  #   ArcholosPotionSystem/{dlls/main.dll, enabled.txt, *.ini}         (mod 503)
  # Also mods 370 and 541. These matched NO installer and installed zero files —
  # the gap a third-party hotfix (nexusmods.com/site/mods/2161) patched into our
  # published index.js by hand. `take: parent.parent` keeps the named mod folder so
  # dlls/ survives as a subfolder, which is where UE4SS loads main.dll from.
  #
  # The `unless` on loader markers keeps UE4SS's own release on ue4ss-injector: it
  # ships sample mods under ue4ss/Mods/ that carry enabled.txt, which this rule
  # would otherwise claim — stripping the loader DLL in the process (verified).
  - id: ue4ss-lua-enabled
    priority: 23
    when: { hasFile: "**/enabled.txt" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/enabled.txt"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: gothic1remake-ue4ss

  # --- Priority 27: Loose native DLL plugin → Binaries/Win64 ---
  # DLLs that go next to the shipping exe, previously unmatched:
  #   amd_fidelityfx_upscaler_dx12.dll + amdxcffx64.dll   (mod 104, OptiScaler)
  #   fyryNy_itemlocator.dll + .ini                       (mod 25)
  #   Gothic1RemakeCore.dll + .addon64                    (mod 36, ReShade addon)
  # Also mods 24, 34, 169. Two Gothic-specific `unless` arms vs the solarpunk
  # template, both deliberate: `**/GothicMod.json` because Gothic is the only game
  # with a native-gothic-mod rule (10) to protect, and `**/enabled.txt` so a UE4SS
  # C++ mod stays with ue4ss-lua-enabled (23) rather than having its dlls/main.dll
  # flattened next to the exe.
  - id: native-dll
    priority: 27
    when: { hasFile: "**/*.dll" }
    unless:
      any:
        - { hasFile: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/ue4ss/**" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/GothicMod.json" }
        - { hasFile: "**/G1R/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.dll"
    take: parent
    placeAt: "${ue4ssInjectorPath}"
    modType: gothic1remake-binaries

  # --- Priority 19: Engine.ini config tweak → %LOCALAPPDATA% Saved/Config ---
  # The largest single unmatched category on this game: mods 12, 15, 28, 70, 83, 95,
  # 107, 153, 284, 321 and 434 ship a bare (or wrapper-wrapped) Engine.ini that UE
  # reads from the USER config dir, not the install dir. `take: parent` strips a
  # wrapper like `Remove Grass/` (mod 70) and keeps a documentation-heavy pack intact
  # (mod 434: 16 files around one Engine.ini).
  #
  # The numbered-variant guard is load-bearing, not defensive. Mod 16 ships
  # 01_Minimum/ … 05_UltraMax/, each with its own Engine.ini + GameUserSettings.ini.
  # The anchor resolves to the SHALLOWEST match, so without the guard this rule
  # installs one arbitrary quality tier and silently drops the other 20 files. Picking
  # a tier for the user is wrong, and the DSL has no chooser (and cannot count sibling
  # directories — every predicate is a boolean over `matchAny`), so it stays unmatched
  # by design. Same reasoning as the multi-variant wrapper case on `wrapped-root`.
  - id: config-ini
    priority: 19
    when: { hasFile: "**/{Engine.ini,engine.ini}" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "**/GothicMod.json" }
        - { hasFile: "G1R/**" }
        - { hasFile: "Engine/**" }
        # `Config/Engine.ini` is a project-relative tree — content-folder (17) owns it.
        - { hasFile: "Config/**" }
        # Numbered variant dirs (01_Minimum/Engine.ini …) — see the note above.
        - { matches: "(^|/)[0-9]{2}_[^/]*/(Engine|engine)\\.ini$" }
    anchor: "**/{Engine.ini,engine.ini}"
    take: parent
    placeAt: "${configPath}"
    modType: gothic1remake-config

  # --- Priority 16: Root (game-relative archives laid out from the install root) ---
  # Positioned AFTER the injector installers (so the Nexus UE4SS repack keeps its
  # dedicated handling) but BEFORE ue4ss-lua/pak. When an archive is arranged from
  # the install root (top-level G1R/ or Engine/), the whole tree deploys as-is, so
  # a MIXED mod (lua under Binaries/ + a pak under Content/Paks/) lands every file
  # in place instead of ue4ss-lua claiming it and dropping the pak.
  - id: root
    priority: 16
    when:
      any:
        - { hasFile: "G1R/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: gothic1remake-root

  # --- Priority 16.5: the same game-relative tree, wrapped in a folder ---
  # `root` (16) anchors its `when` at the archive root, so an author who wraps the
  # tree in a folder — usually the mod's own name, sometimes a variant label —
  # matched NOTHING and the mod installed zero files, silently:
  #   violet/G1R/Content/Paks/G1R_BlueScavengerMount_P.pak     (mod 508)
  #   Classic/G1R/Content/Movies/G1R_Intro.bk2                 (mod 367)
  #   G1RMeshProject/G1R/...                                   (mod 447, 2124 files)
  # Affected mods 367, 392, 447, 508, 523.
  #
  # `copy: {stripCommonRoot: true}` is deliberate, not interchangeable with a
  # directory anchor. Two properties matter:
  #   - It keeps files that sit OUTSIDE the game tree (a wrapped README), which a
  #     `**/G1R/` anchor with `take: self` would silently drop.
  #   - A single anchor cannot span both G1R/ and Engine/ — it keeps one and drops
  #     the other, which would break the shipped `root: G1R + Engine segments`
  #     case — whereas the whole-archive copy keeps both.
  # It also self-guards multi-variant archives (several sibling wrappers each
  # holding a full tree): with no single common root there is nothing to strip, so
  # the variants deploy verbatim as folders the game ignores rather than collapsing
  # onto one set of destinations. The DSL cannot count sibling directories (every
  # predicate is a boolean over `matchAny`), so this is the only available guard —
  # and it is the right outcome anyway.
  - id: wrapped-root
    priority: 16.5
    when:
      all:
        - any:
            - { hasFile: "**/G1R/**" }
            - { hasFile: "**/Engine/**" }
        - not: { hasFile: "G1R/**" }
        - not: { hasFile: "Engine/**" }
    copy: { stripCommonRoot: true }
    modType: gothic1remake-root

  # --- Priority 17: Content folder (project-relative trees: Content/, Config/, Binaries/) ---
  # Sibling of `root` for archives laid out from the project folder rather than the
  # install root. Whole tree deploys to ${gamePath} (= installPath/G1R), so a bare
  # Binaries/ tree correctly lands under the project folder.
  - id: content-folder
    priority: 17
    when:
      any:
        - { hasFile: "Content/**" }
        - { hasFile: "Config/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${gamePath}"
    modType: gothic1remake-contentfolder

  # --- Pak (default, flatten into ~mods) ---
  - id: pak
    priority: 30
    when: { hasFile: "**/*.pak" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/G1R/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/GothicMod.json" }
        # Chromium/Electron apps bundle dozens of resource .pak files that are NOT
        # UE paks. Mod 98 (Witcher Remapper) is an Electron tool — 58 locales/*.pak
        # plus an .exe — and this rule was dumping all 109 files, executable
        # included, into ~mods. Its own page says "Extract → Run the .exe", so it is
        # a standalone tool with no install location under the game: leaving it
        # unmatched is the correct outcome, not a coverage gap. These three markers
        # appear in every Electron bundle and in no UE pak mod in the corpus.
        - { hasFile: "**/locales/*.pak" }
        - { hasFile: "**/resources.pak" }
        - { hasFile: "**/*.exe" }
    anchor: "**/*.pak"
    take: parent
    placeAt: "${pakModsPath}"
    modType: gothic1remake-pak

  # --- Claim (B) of the mods/2161 hotfix, deliberately NOT implemented ---
  # It also "changes install rule for pak mods to preserve parent folders inside
  # Content/Paks/~mods". Not reproducible: across 366 cached Gothic archives there
  # are zero destination collisions and every pak mod routes correctly. `take:
  # parent` is anchor-depth-relative (see stripPath in
  # gdl/src/runtime/installer-engine.ts), NOT "always strip one segment" — the one
  # archive with paks in two subfolders keeps its structure already. Their patch
  # synthesises a folder name from the pak basename, which `take:` cannot and
  # should not express, and UE loads paks recursively under ~mods anyway. Don't
  # re-litigate without a failing archive.

discovery:
  version:
    file: "${installPath}/G1R/Version/version.txt"
    regex: "Build(\\d+_CL\\d+)"

setup:
  ensureDirs:
    - ${pakModsPath}
    - ${ue4ssModsPath}
    # MUST stay alongside the config-ini installer. UE only creates this folder on
    # first launch, so a config mod deployed on a fresh install would otherwise
    # target a missing directory — the Paralives 1.3.1 failure mode
    # ("Deployment target unknown"), which no test or corpus run catches.
    - ${configPath}

events:
  did-deploy: { hook: regenerateModsTxt }

toolbarActions:
  - id: open-ue4ss-settings
    title: Open UE4SS Settings INI
    priority: 200
    target: { openFile: "${ue4ssRootPath}/UE4SS-settings.ini" }

  - id: open-mods-txt
    title: Open UE4SS mods.txt
    priority: 201
    target: { openFile: "${ue4ssModsPath}/mods.txt" }

  - id: open-nexus-page
    title: Open Nexus Page
    priority: 202
    target: { openUrl: "https://www.nexusmods.com/gothic1remake" }

nexus:
  modId: 1943
  fileGroupId: 7473926
  displayName: Gothic 1 Remake Support for Vortex

tests:
  corpus: nexus
  cases:
    # --- Native Gothic Mods ---
    - name: "native: mod with GothicMod.json"
      archive:
        - MyGothicMod/GothicMod.json
        - MyGothicMod/Data/meshes.pak
      expect:
        matched: native-gothic-mod
        modType: gothic1remake-nativemod
        plan:
          - ${nativeModsPath}/MyGothicMod/GothicMod.json
          - ${nativeModsPath}/MyGothicMod/Data/meshes.pak

    - name: "native: wrapped mod strips outer directory"
      archive:
        - wrapper/CoolMod/GothicMod.json
        - wrapper/CoolMod/Config/Engine.ini
      expect:
        matched: native-gothic-mod
        modType: gothic1remake-nativemod
        plan:
          - ${nativeModsPath}/CoolMod/GothicMod.json
          - ${nativeModsPath}/CoolMod/Config/Engine.ini

    # --- UE4SS Injector ---
    - name: "injector: dwmapi.dll at archive root"
      archive:
        - dwmapi.dll
        - UE4SS.dll
      expect:
        matched: ue4ss-injector
        modType: gothic1remake-ue4ss-injector
        plan:
          - ${ue4ssInjectorPath}/dwmapi.dll
          - ${ue4ssInjectorPath}/UE4SS.dll

    - name: "injector: marker in subfolder strips wrapper"
      archive:
        - ue4ss/dwmapi.dll
        - ue4ss/UE4SS.dll
        - ue4ss/UE4SS-settings.ini
      expect:
        matched: ue4ss-injector
        modType: gothic1remake-ue4ss-injector
        plan:
          - ${ue4ssInjectorPath}/dwmapi.dll
          - ${ue4ssInjectorPath}/UE4SS.dll
          - ${ue4ssInjectorPath}/UE4SS-settings.ini

    # Nexus repack already contains `G1R/Binaries/Win64/`, so it must not
    # get that path duplicated again during install.
    - name: "injector: game-relative Win64 folder strips game path"
      archive:
        - G1R/Binaries/Win64/dwmapi.dll
        - G1R/Binaries/Win64/UE4SS.dll
        - G1R/Binaries/Win64/UE4SS-settings.ini
      expect:
        matched: ue4ss-injector-repack
        modType: gothic1remake-ue4ss-injector
        plan:
          - ${ue4ssInjectorPath}/dwmapi.dll
          - ${ue4ssInjectorPath}/UE4SS.dll
          - ${ue4ssInjectorPath}/UE4SS-settings.ini

    # --- UE4SS Lua ---
    - name: "ue4ss: lua mod with Scripts folder"
      archive:
        - MyMod/Scripts/main.lua
        - MyMod/Scripts/util.lua
      expect:
        matched: ue4ss-lua
        modType: gothic1remake-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/Scripts/util.lua

    - name: "ue4ss: wrapped mod strips outer directory"
      archive:
        - wrapper/MyMod/Scripts/main.lua
        - wrapper/MyMod/enabled.txt
      expect:
        matched: ue4ss-lua
        modType: gothic1remake-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/enabled.txt

    # --- Root ---
    # --- Engine.ini config tweaks → %LOCALAPPDATA% (11 mods, largest single category) ---
    - name: "config-ini: bare Engine.ini → user config dir (mods 12, 83, 95, 107)"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: gothic1remake-config
        plan:
          - ${configPath}/Engine.ini

    - name: "config-ini: wrapper folder stripped (mod 70 'Remove Grass/')"
      archive:
        - Remove Grass/Engine.ini
      expect:
        matched: config-ini
        modType: gothic1remake-config
        plan:
          - ${configPath}/Engine.ini

    # NOTE: mod 16's numbered variant pack (01_Minimum/Engine.ini … 05_UltraMax/) must
    # stay UNMATCHED — matching would install one arbitrary tier and drop the other 20
    # files. There is no inline way to assert that: `expect.matched` is validated
    # against declared installer ids (gdl/src/schema/validator.ts, GDL122), so
    # `matched: null` is rejected and the DSL has no negative form. Verified instead by
    # the corpus, where 7371_16_* reports `no installer matched`, and by config-validator
    # excluding the same shape so it doesn't demand a match.

    # A config bundled WITH real payload keeps the payload's routing, not config-ini.
    - name: "config-ini does not steal archives that also ship a pak"
      archive:
        - SomeMod/Engine.ini
        - SomeMod/SomeMod_P.pak
      expect:
        matched: pak
        modType: gothic1remake-pak

    # --- UE4SS C++ mod: compiled dll + enabled.txt, no Lua (mods 271, 370, 503, 541) ---
    # The gap the mods/2161 hotfix patched by hand. `take: parent.parent` must keep the
    # mod folder so dlls/ survives — UE4SS loads Mods/<Name>/dlls/main.dll from there.
    - name: "ue4ss-lua-enabled: C++ mod with dlls/main.dll + enabled.txt (mod 271)"
      archive:
        - SuperArmorOverlay/README.txt
        - SuperArmorOverlay/dlls/main.dll
        - SuperArmorOverlay/enabled.txt
      expect:
        matched: ue4ss-lua-enabled
        modType: gothic1remake-ue4ss
        plan:
          - ${ue4ssModsPath}/SuperArmorOverlay/README.txt
          - ${ue4ssModsPath}/SuperArmorOverlay/dlls/main.dll
          - ${ue4ssModsPath}/SuperArmorOverlay/enabled.txt

    # Guard: the UE4SS release itself ships sample mods carrying enabled.txt, which
    # ue4ss-lua-enabled (23) would otherwise claim — stripping the loader DLL (mod 86).
    - name: "ue4ss-injector still wins over ue4ss-lua-enabled for the loader (mod 86)"
      archive:
        - dwmapi.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/BPModLoaderMod/Scripts/main.lua
        - ue4ss/Mods/SomeMod/enabled.txt
      expect:
        matched: ue4ss-injector
        modType: gothic1remake-ue4ss-injector

    # --- Loose native DLLs next to the shipping exe (mods 24, 25, 34, 36, 104, 169) ---
    - name: "native-dll: loose upscaler DLLs at archive root (mod 104)"
      archive:
        - amd_fidelityfx_upscaler_dx12.dll
        - amdxcffx64.dll
      expect:
        matched: native-dll
        modType: gothic1remake-binaries
        plan:
          - ${ue4ssInjectorPath}/amd_fidelityfx_upscaler_dx12.dll
          - ${ue4ssInjectorPath}/amdxcffx64.dll

    # Guard: a native Gothic mod bundling a DLL keeps its p10 routing, not native-dll.
    - name: "native-gothic-mod wins over native-dll"
      archive:
        - MyMod/GothicMod.json
        - MyMod/Binaries/plugin.dll
      expect:
        matched: native-gothic-mod
        modType: gothic1remake-nativemod

    # --- Wrapped game-relative tree: mods 13, 63, 367, 392, 447, 508, 523, 538 ---
    # `root` (16) anchors its `when` at the archive root, so an author who wrapped the
    # tree in a folder (usually the mod name, sometimes a variant label like `violet/`
    # or `Classic/`) matched nothing and the mod installed ZERO files. `wrapped-root`
    # (16.5) strips the single shared wrapper; the README outside the game tree
    # survives, which a `**/G1R/` anchor with `take: self` would have dropped.
    - name: "wrapped-root: wrapper folder stripped, README kept (mods 13, 63, 508)"
      archive:
        - Gothic 1 Remake/G1R/Content/Paks/G1R-Windows_P.pak
        - Gothic 1 Remake/G1R/Story/Cache/AlkimiaLocalization_00000000.lcache
        - Gothic 1 Remake/00_README_INSTALLATION.txt
      expect:
        matched: wrapped-root
        modType: gothic1remake-root
        plan:
          - G1R/Content/Paks/G1R-Windows_P.pak
          - G1R/Story/Cache/AlkimiaLocalization_00000000.lcache
          - 00_README_INSTALLATION.txt

    # A tree already at the archive root must stay with `root` (16) — otherwise
    # `stripCommonRoot` would eat the G1R/ segment itself. This is also why a single
    # directory anchor was rejected: it cannot span both G1R/ and Engine/ (see the
    # `root: G1R + Engine segments` case below, which it would have broken).
    - name: "root still wins for an unwrapped tree (wrapped-root declines)"
      archive:
        - G1R/Content/Paks/foo.pak
        - ReadMe.txt
      expect:
        matched: root
        modType: gothic1remake-root

    - name: "root: G1R + Engine segments"
      archive:
        - G1R/Content/Paks/foo.pak
        - Engine/Content/bar.uasset
      expect:
        matched: root
        modType: gothic1remake-root
        plan:
          - ${installPath}/G1R/Content/Paks/foo.pak
          - ${installPath}/Engine/Content/bar.uasset

    - name: "content-folder: bare Binaries/ tree lands under the project folder"
      archive:
        - Binaries/Win64/mod.dll
      expect:
        matched: content-folder
        modType: gothic1remake-contentfolder
        plan:
          - ${gamePath}/Binaries/Win64/mod.dll

    # --- Content Folder ---
    - name: "content-folder: Content/ at archive root"
      archive:
        - Content/Foo.uasset
        - Content/Bar.uexp
      expect:
        matched: content-folder
        modType: gothic1remake-contentfolder
        plan:
          - ${gamePath}/Content/Foo.uasset
          - ${gamePath}/Content/Bar.uexp

    - name: "content-folder: Config/ at archive root"
      archive:
        - Config/settings.ini
      expect:
        matched: content-folder
        modType: gothic1remake-contentfolder
        plan:
          - ${gamePath}/Config/settings.ini

    # --- Pak (default) ---
    - name: "pak: single pak file"
      archive:
        - SomeMod/Cool.pak
      expect:
        matched: pak
        modType: gothic1remake-pak
        plan:
          - ${pakModsPath}/Cool.pak

    - name: "pak: pak+ucas+utoc triplet flattened"
      archive:
        - SomeMod/files/x_P.pak
        - SomeMod/files/x_P.ucas
        - SomeMod/files/x_P.utoc
      expect:
        matched: pak
        modType: gothic1remake-pak
        plan:
          - ${pakModsPath}/x_P.pak
          - ${pakModsPath}/x_P.ucas
          - ${pakModsPath}/x_P.utoc

    # --- Priority scenarios ---
    - name: "native-gothic-mod wins over pak"
      archive:
        - MyMod/GothicMod.json
        - MyMod/Data/content.pak
      expect:
        matched: native-gothic-mod
        modType: gothic1remake-nativemod

    # --- Mixed game-relative mod (UE4SS lua + asset-replacement pak) ---
    # A single archive laid out from the install root carrying BOTH a UE4SS Lua
    # payload and a pak must deploy as one intact tree — the pak must NOT be
    # dropped by the narrower ue4ss-lua installer claiming the archive.
    - name: "root: mixed lua+pak game-relative archive keeps paks"
      archive:
        - G1R/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
        - G1R/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
        - G1R/Content/Paks/~mods/Foo_P.pak
      expect:
        matched: root
        modType: gothic1remake-root
        plan:
          - ${installPath}/G1R/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
          - ${installPath}/G1R/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
          - ${installPath}/G1R/Content/Paks/~mods/Foo_P.pak

validators:
  - id: native-mod-validator
    name: Archives with GothicMod.json should match native-gothic-mod installer
    when: { hasFile: "**/GothicMod.json" }
    assert:
      matched: native-gothic-mod

  - id: injector-validator
    name: Archives with injector markers should match ue4ss-injector
    # Game-relative loader bundles are claimed by `root` by design (see installer 15), so
    # they're excluded here.
    when:
      all:
        - { hasFile: "**/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { not: { hasFile: "**/Win64/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" } }
        - { not: { hasFile: "G1R/**" } }
        - { not: { hasFile: "Engine/**" } }
    assert:
      matched: ue4ss-injector

  - id: injector-repack-validator
    name: Archives with game-relative injector markers should match ue4ss-injector-repack
    # Repack archives that also ship payload outside Binaries/ are claimed by `root` /
    # `content-folder` by design (see installer 14), so they're excluded here.
    when:
      all:
        - { hasFile: "**/Win64/{dwmapi.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { not: { hasFile: "**/Content/Paks/**" } }
        - { not: { hasFile: "**/Mods/**" } }
    assert:
      matched: ue4ss-injector-repack

  # Placement guard, ported from solarpunk — gothic shipped without it. This is the
  # validator that catches DROPPED payload, not just misplaced payload: the runner
  # fails when no planned file matches `files` at all (validator-runner.ts), which is
  # exactly how halocampaignevolved caught its injector-vs-root ordering bug. Electron
  # resource paks are excluded because `pak` deliberately declines them (installer 30).
  - id: config-validator
    name: Bare Engine.ini archives (no payload) match config-ini and land in the user config dir
    when:
      all:
        - { hasFile: "**/{Engine.ini,engine.ini}" }
        - { not: { hasFile: "**/*.pak" } }
        - { not: { hasFile: "**/*.utoc" } }
        - { not: { hasFile: "**/*.dll" } }
        - { not: { hasFile: "**/*.lua" } }
        - { not: { hasFile: "G1R/**" } }
        - { not: { hasFile: "Engine/**" } }
        - { not: { hasFile: "Config/**" } }
        - { not: { matches: "(^|/)[0-9]{2}_[^/]*/(Engine|engine)\\.ini$" } }
    assert:
      matched: config-ini
      placement:
        - files: "**/{Engine.ini,engine.ini}"
          mustMatch: "**/Saved/Config/**"

  - id: pak-payload-placement
    name: .pak/.ucas/.utoc install under Content/Paks, never at the game root
    when:
      all:
        - { hasFile: "**/*.{pak,ucas,utoc}" }
        - { not: { hasFile: "**/locales/*.pak" } }
        - { not: { hasFile: "**/resources.pak" } }
        # KNOWN-UNFIXABLE, excluded so the guard stays green for everything it can
        # actually police. Mods 76 and 355 are genuinely MIXED at the archive root: a
        # UE4SS Lua mod folder next to loose pak sets. ue4ss-lua (22) claims the
        # archive and carries the paks into ue4ss/Mods, where UE never reads them.
        # Vortex allows exactly ONE modType per mod (`setmodtype` is a single scalar
        # assignment), and the DSL maps one install root to one destination, so no
        # rule here can split the archive. Fixing it needs multi-destination support
        # in gdl/ — a separate repo (CLAUDE.md rule 3). Same class as
        # halocampaignevolved mod 73. Remove this arm when that lands.
        - { not: { hasFile: "**/Scripts/*.lua" } }
    assert:
      placement:
        - files: "**/*.{pak,ucas,utoc}"
          mustMatch: "**/Content/Paks/**"
          mustNotMatch: "${installPath}/*"
