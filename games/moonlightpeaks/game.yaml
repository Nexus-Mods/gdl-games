gdl: 1
version: 1.0.3   # extension version — drives info.json, the release tag, and the zip name

# Moonlight Peaks (Little Chicken Game Company) — Unity, modded via the BepInEx loader.
# Supports: BepInEx plugin archives (BepInEx/plugins/...) and whole-folder "root" mods.
#
# Both modTypes deliberately resolve to ${installPath}: `bepinex` uses take: self on the
# BepInEx/ folder and `root` uses take: archive-root, so in both cases each file keeps its
# own relative prefix and self-places under the game folder. The two ids exist to label
# the mod type in Vortex's UI, not to point at different directories.
#
# Corpus state: 68 mods are published, but every upload postdates the June 2026 Nexus
# manifest outage, so `test:corpus --fetch` fetches nothing and tests/cache/ is empty —
# a run prints 68 "✖" lines and still exits 0. The tests.cases below are therefore the
# only regression guard. To route the real catalogue, generate listings first:
#   node tools/corpus/list-archive.mjs --domain moonlightpeaks --game-id 9480 --all \
#     --out games/moonlightpeaks/tests/cache
# See docs/corpus-manifests.md.

game:
  id: moonlightpeaks
  name: Moonlight Peaks
  executable: Moonlight Peaks.exe
  requiredFiles: ["Moonlight Peaks.exe"]
  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: moonlightpeaks
  details:
    supportsSymlinks: true

stores:
  steam: "2209900"

context:
  pluginsPath: "${installPath}/BepInEx/plugins"

modTypes:
  - { id: moonlightpeaks-root, name: "Root (game folder)", path: "${installPath}" }
  - { id: moonlightpeaks-bepinex, name: "BepInEx (game folder)", path: "${installPath}" }

installers:
  - id: bepinex
    priority: 10
    when: { hasFile: "**/BepInEx/**" }
    anchor: "**/BepInEx/"
    take: self
    placeAt: "${installPath}"
    modType: moonlightpeaks-bepinex

  - id: root
    priority: 20
    when: { hasFile: "**/*" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: moonlightpeaks-root

setup:
  ensureDirs:
    - ${pluginsPath}

toolbarActions:
  - { id: open-nexus-page, title: Open Nexus Page, priority: 200, target: { openUrl: "https://www.nexusmods.com/moonlightpeaks" } }

nexus:
  modId: 2027
  fileGroupId: 7625237
  displayName: Moonlight Peaks Support for Vortex

validators:
  - id: bepinex-validator
    name: Archives containing a BepInEx/ folder deploy to the game install root
    when: { hasFile: "**/BepInEx/**" }
    assert:
      matched: bepinex
      modType: moonlightpeaks-bepinex

tests:
  corpus: nexus
  cases:
    - name: "root: flat files deploy to game root"
      archive:
        - mod.dll
        - readme.txt
      expect:
        matched: root
        modType: moonlightpeaks-root
        plan:
          - ${installPath}/mod.dll
          - ${installPath}/readme.txt

    - name: "root: subfolder structure is preserved at game root"
      archive:
        - CustomLoader/plugin.dll
      expect:
        matched: root
        modType: moonlightpeaks-root
        plan:
          - ${installPath}/CustomLoader/plugin.dll

    - name: "bepinex: BepInEx/plugins at archive root"
      archive:
        - BepInEx/plugins/mod.dll
      expect:
        matched: bepinex
        modType: moonlightpeaks-bepinex
        plan:
          - ${installPath}/BepInEx/plugins/mod.dll
