gdl: 1
version: 1.0.0   # extension version: drives info.json, the release tag, and the zip name

# Phantom Blade Zero (S-GAME Studio / S-GAME Publishing): single-player wuxia action RPG.
# Steam app 4115450; Nexus domain phantombladezero (v1 game id 10614).
#
# Scaffolded pre-release on 2026-10-21 with placeholder paths, then corrected on launch day
# (2026-10-29) from a real Steam install (build 26266538, run once) and the first 31 mods.
#
# Sources:
#   * Steam app 4115450, developer S-GAME Studio, publisher S-GAME Publishing: Steam
#     storesearch, appdetails and SteamCMD appinfo.
#   * Unreal Engine 5: the game's Epic store description. Denuvo on PC per press coverage;
#     it hasn't stopped pak or UE4SS mods (both exist on Nexus at launch).
#   * Nexus domain phantombladezero, game id 10614: v1 /games/phantombladezero.json.
#
# Install layout (Steam, seen on disk). This is NOT the standard UE layout:
#   PBZ/
#     steam/PBZ.exe            1 MB launcher. Steam's launch entry (appinfo config.launch.0).
#     platform/steam/PBZ.exe   511 MB game exe. UE4SS, ReShade and proxy DLLs go beside
#                              it, not in ProjectPBZ/Binaries/Win64 (which holds only
#                              third-party DLLs). Nexus mod 5 (UE4SS for PBZ) installs to
#                              platform/steam, and six other mods ship that folder.
#     ProjectPBZ/              the UE project folder. Paks in ProjectPBZ/Content/Paks,
#                              with global.utoc, so IoStore is confirmed.
#     ProjectPBZ/Saved/        saves and input settings live in the install, not AppData
#                              (Steam Cloud path ProjectPBZ/Saved/SaveGames/Steam/{id}).
#     Engine/                  engine third-party binaries.
#   User config is still in AppData: %LOCALAPPDATA%/ProjectPBZ/Saved/Config/Windows held
#   GameUserSettings.ini after the first run.
# The platform/steam folder name implies an Epic build uses a different platform folder,
# which is why binariesPath branches on store (see context). Unverified until Epic ships.
#
# Supports the UE5 ladder from games/starwarszerocompany (pak mods in Content/Paks/~mods,
# IoStore-only mods, LogicMods, UE4SS loader + Lua + C++ mods, ReShade presets, loose
# native DLLs, Engine.ini tweaks, and game-relative or wrapped "root" mods), with
# platform/ added as a game-relative top-level folder alongside ProjectPBZ/ and Engine/.
#
# gameart.webp is the Nexus tile, saved as-is (recipe §3), 2026-10-26. Until the game was
# approved the tile 404'd and a Steam library-capsule stand-in was used; it is the same art.
#
# ===============================================================================

game:
  id: phantombladezero
  name: Phantom Blade Zero
  # Steam's launch entry: the 1 MB launcher, which starts platform/steam/PBZ.exe.
  executable: steam/PBZ.exe
  # A discovery fingerprint, not the launch target; every entry must exist (no globs).
  # Both are Steam-specific paths. If Epic is added, switch to a file every store has,
  # such as ProjectPBZ/Content/Paks/global.utoc.
  requiredFiles: [steam/PBZ.exe, platform/steam/PBZ.exe]
  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: phantombladezero
  details:
    # UE5 IoStore games crash on symlinked .utoc/.ucas (games/starwarszerocompany, verified
    # 2026-08-30), so symlink deployment is refused. Vortex only tests `=== false`. This
    # game is IoStore (ProjectPBZ/Content/Paks/global.utoc on disk).
    supportsSymlinks: false
    gameProjectFolder: ProjectPBZ
    ignoreConflicts: [UE4SS-settings.ini, enabled.txt]

#   steam: 4115450, confirmed via Steam storesearch, appdetails and SteamCMD appinfo.
#          (Search also returns app 3910040, "Late Ming Dynasty: The Realm of Abyss Phantom
#          Blade Zero". That is DLC for a different game, fullgame 3853470. Ignore it.)
#   epic:  OMITTED. The offer exists (egdata offer 88515e1f36d9408f890ad0f3a5201093,
#          namespace 8d51845827ea4ad0a117cefd9eb23bd2, prePurchase: true), but on
#          2026-10-21 the sandbox's only assets are 0-byte Win32/Windows entries sharing
#          artifactId 9cf0b46dfb074d10bb620e45fac185c9, the pre-purchase stub shape seen on
#          planetzoo2 and starwarszerocompany. Vortex matches the SHIPPING artifact's
#          manifest AppName. Still the stub on 2026-10-29 after launch (egdata sandbox
#          assets); re-check, and check its platform folder before adding an arm below.
#   xbox:  OMITTED. No Microsoft Store listing (storeedgefd search, 2026-10-21) and no Xbox
#          version announced.
stores:
  steam: "4115450"

context:
  # The game exe sits in platform/<store>/, not <Project>/Binaries/Win64 (see the header).
  # Only Steam is declared and seen, so there is a single arm. Kept as a storeBranch so an
  # Epic arm is a one-line change once its folder name is known.
  platformFolder:
    storeBranch:
      default: steam

  gamePath: ${installPath}/ProjectPBZ

  pakModsPath:   ${gamePath}/Content/Paks/~mods
  logicModsPath: ${gamePath}/Content/Paks/LogicMods
  paksPath:      ${gamePath}/Content/Paks
  contentPath:   ${gamePath}/Content

  # UE4SS / ReShade / loose DLL plugins all live next to the game exe.
  binariesPath:  ${installPath}/platform/${platformFolder}
  ue4ssRootPath: ${binariesPath}/ue4ss
  ue4ssModsPath: ${binariesPath}/ue4ss/Mods

  # Seen on disk after the first run (GameUserSettings.ini written there).
  configPath: ${appDataLocal}/ProjectPBZ/Saved/Config/Windows

modTypes:
  # Rename freely until the first release. After that these ids are permanent (rule 6 in
  # CLAUDE.md): Vortex stores the id against every installed mod.
  - { id: pbz-pak,            name: "Paks (~mods)",               path: "${pakModsPath}" }
  # Deploys under Content/Paks; the LogicMods/ subfolder rides along in each file's
  # stripped relative path (so placeAt == this path; see GDL114).
  - { id: pbz-logicmods,      name: "LogicMods (Blueprint paks)", path: "${paksPath}" }
  - { id: pbz-ue4ss,          name: "UE4SS (Lua mods)",           path: "${ue4ssModsPath}" }
  - { id: pbz-ue4ss-injector, name: "UE4SS (loader)",             path: "${binariesPath}" }
  - { id: pbz-binaries,       name: "Binaries (ReShade / DLL plugins)", path: "${binariesPath}" }
  - { id: pbz-root,           name: "Root (game folder)",         path: "${installPath}" }
  - { id: pbz-contentfolder,  name: "Content folder",             path: "${gamePath}" }
  # Deploys under Content/; the Paks/ subfolder rides along in each file's stripped
  # relative path (so placeAt == this path; see GDL114).
  - { id: pbz-pakalt,         name: "Paks (no ~mods)",            path: "${contentPath}" }
  # deploymentEssential: false is load-bearing. This is the only modType off the game
  # drive, and Vortex drops a deployment method that can't handle ANY registered modType.
  # Hardlink and move need the target on the staging folder's volume, so for a game on D:
  # this one path on C: removed both, and with symlinks refused that left no deployment
  # method at all (reproduced on starwarszerocompany 2026-08-31). `false` demotes the
  # rejection to a warning. Config mods still fail cross-volume (EXDEV) for those users,
  # reported as "files were locked by external applications". See docs/deployment-methods.md.
  - { id: pbz-config,         name: "Config (Engine.ini tweaks)", path: "${configPath}",
      deploymentEssential: false }

# The ladder below is games/starwarszerocompany's, rule for rule, with only the project
# folder literal changed, platform/ added as a game-relative folder, and ue4ss-cpp added.
# Mod ids cited as "PBZ mod N" are Phantom Blade Zero mods; others are mods on
# starwarszerocompany (or halocampaignevolved where named), the evidence for each rule.
installers:
  # --- Priority 15: UE4SS loader (dwmapi/xinput proxy or UE4SS-settings.ini) → Binaries ---
  # PBZ mods 5, 13 and 14 ship dwmapi.dll + ue4ss/ flat; they land in platform/steam.
  # The `unless` is load-bearing: `take: parent` resolves the install root to
  # the loader's folder and drops every file outside it, so a game-relative archive
  # shipping the loader AND a pak would lose the pak (halocampaignevolved mod 68). Declining
  # game-relative archives hands them to `root` (16), which deploys the tree intact.
  - id: ue4ss-injector
    priority: 15
    when: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "ProjectPBZ/**" }
        - { hasFile: "Engine/**" }
        - { hasFile: "platform/**" }
    anchor: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: parent
    placeAt: "${binariesPath}"
    modType: pbz-ue4ss-injector

  # --- Priority 16: Root (game-relative archives laid out from the install root) ---
  # After the loader, before logicmods/ue4ss-lua/pak, so a MIXED game-relative mod lands
  # every file instead of one rule claiming part of it. PBZ mod 7 ships a pak under
  # ProjectPBZ/Content/Paks/~mods plus an ASI loader under platform/steam; mod 19 a pak
  # plus a Lua mod under platform/steam/ue4ss/Mods. Mod 35 replaces
  # ProjectPBZ/Saved/EnhancedInputUserSettings.sav, which also lives in the install.
  - id: root
    priority: 16
    when:
      any:
        - { hasFile: "ProjectPBZ/**" }
        - { hasFile: "Engine/**" }
        - { hasFile: "platform/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: pbz-root

  # --- Priority 16.5: the same game-relative tree, wrapped in a folder ---
  # `root` anchors at the archive root, so a wrapped tree matches nothing and installs zero
  # files, silently (six mods on halocampaignevolved). stripCommonRoot keeps files outside
  # the game tree (a README) and spans <Project>/, Engine/ and platform/, which a directory
  # anchor can't. Multi-variant archives have no common root and deploy verbatim, inert.
  - id: wrapped-root
    priority: 16.5
    when:
      all:
        - any:
            - { hasFile: "**/ProjectPBZ/**" }
            - { hasFile: "**/Engine/**" }
            - { hasFile: "**/platform/**" }
        - not: { hasFile: "ProjectPBZ/**" }
        - not: { hasFile: "Engine/**" }
        - not: { hasFile: "platform/**" }
    copy: { stripCommonRoot: true }
    modType: pbz-root

  # --- Priority 17: Content folder (project-relative trees: Content/, Config/, Binaries/) ---
  - id: content-folder
    priority: 17
    when:
      any:
        - { hasFile: "Content/**" }
        - { hasFile: "Config/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${gamePath}"
    modType: pbz-contentfolder

  # --- Priority 18: ReShade preset (ReShade.ini, strip wrapper) → Binaries ---
  - id: reshade
    priority: 18
    when: { hasFile: "**/ReShade.ini" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/ReShade.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: pbz-binaries

  # --- Priority 19: UE user-config tweak (Engine.ini etc.) → %LOCALAPPDATA% Saved/Config ---
  # The most common category on halocampaignevolved (5 of 38) and a steady one on
  # starwarszerocompany (mods 2, 7, 16, 20 there). Both spellings ship, hence the brace
  # list. The `unless` arms keep a config bundled WITH real payload on that payload's rule;
  # tests.cases asserts the pak guard. This brace list must stay in sync with
  # reshade-preset's: on starwarszerocompany a bare game.ini (mod 16) was swallowed as a
  # ReShade preset and shipped mis-routed until both lists agreed.
  - id: config-ini
    priority: 19
    when:
      hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}"
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "ProjectPBZ/**" }
        - { hasFile: "Engine/**" }
        - { hasFile: "platform/**" }
    anchor: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}"
    take: parent
    placeAt: "${configPath}"
    modType: pbz-config

  # --- Priority 19.5: bare ReShade PRESET .ini (not ReShade.ini itself) → Binaries ---
  # Authors often ship only the preset, named after itself (starwarszerocompany mod 12).
  # After config-ini on purpose, and excluding the UE config names, so an Engine.ini keeps
  # its user-config routing.
  - id: reshade-preset
    priority: 19.5
    when: { hasFile: "**/*.ini" }
    unless:
      any:
        - { hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "**/ProjectPBZ/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/platform/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: pbz-binaries

  # --- Priority 20: LogicMods (Blueprint paks under LogicMods/) → Content/Paks ---
  - id: logicmods
    priority: 20
    when: { hasFile: "**/LogicMods/**" }
    anchor: "**/LogicMods/"
    take: self
    placeAt: "${paksPath}"
    modType: pbz-logicmods

  # --- Priority 22: UE4SS Lua (Scripts/*.lua present) → ue4ss/Mods ---
  - id: ue4ss-lua
    priority: 22
    when: { hasFile: "**/Scripts/*.lua" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/Scripts/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: pbz-ue4ss

  # --- Priority 23: UE4SS mod keyed by enabled.txt only (e.g. a dll payload) → ue4ss/Mods ---
  - id: ue4ss-lua-enabled
    priority: 23
    when: { hasFile: "**/enabled.txt" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/enabled.txt"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: pbz-ue4ss

  # --- Priority 23.5: UE4SS C++ mod (<Mod>/dlls/main.dll, no enabled.txt) → ue4ss/Mods ---
  # PBZ mod 17 (PBZ Pause, UE4SS file) ships ue4ss/Mods/PBZPause/dlls/{main.dll,config.ini}
  # and tells users to add it to mods.txt by hand, which an installer can't do. Without
  # this rule nothing matched: native-dll declines anything under ue4ss/.
  - id: ue4ss-cpp
    priority: 23.5
    when: { hasFile: "**/dlls/main.dll" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/dlls/main.dll"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: pbz-ue4ss

  # --- Priority 24: UE4SS Lua (bare .lua, no Scripts/ dir) → ue4ss/Mods ---
  - id: ue4ss-lua-bare
    priority: 24
    when: { hasFile: "**/*.lua" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: pbz-ue4ss

  # --- Priority 27: Loose native DLL plugin → Binaries ---
  - id: native-dll
    priority: 27
    when: { hasFile: "**/*.dll" }
    unless:
      any:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/ue4ss/**" }
        - { hasFile: "**/ReShade.ini" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/ProjectPBZ/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/platform/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.dll"
    take: parent
    placeAt: "${binariesPath}"
    modType: pbz-binaries

  # --- Priority 28: A Paks/ folder bundled in the archive (not ~mods) → Content/Paks ---
  - id: pak-alt
    priority: 28
    when:
      all:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Paks/**" }
    unless:
      any:
        - { hasFile: "**/~mods/**" }
        - { hasFile: "**/LogicMods/**" }
        - { hasFile: "**/ProjectPBZ/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/platform/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/Paks/"
    take: self
    placeAt: "${contentPath}"
    modType: pbz-pakalt

  # --- Priority 29: IO Store mod (utoc/ucas without a .pak) → ~mods ---
  # A mod carrying BOTH a .pak and a .utoc routes to `pak` (30) instead, which keeps the
  # triplet together. tests.cases pins that ordering.
  - id: pak-iostore
    priority: 29
    when: { hasFile: "**/*.utoc" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/ProjectPBZ/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/platform/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.utoc"
    take: parent
    placeAt: "${pakModsPath}"
    modType: pbz-pak

  # --- Priority 30: Default pak mod → flatten into ~mods ---
  - id: pak
    priority: 30
    when: { hasFile: "**/*.pak" }
    unless:
      any:
        - { hasFile: "**/ProjectPBZ/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/platform/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.pak"
    take: parent
    placeAt: "${pakModsPath}"
    modType: pbz-pak

setup:
  ensureDirs:
    - ${pakModsPath}
    # UE writes the user config dir only on first launch and ships no Engine.ini, so a
    # config mod deployed before first launch would hit a missing target ("Deployment
    # target unknown", fixed for games/paralives in 1.3.1).
    - ${configPath}
    # Lua mods deploy here, but nothing creates it until the UE4SS loader is installed.
    # This only stops the deploy failing; the loader is still required.
    - ${ue4ssModsPath}

toolbarActions:
  - id: open-ue4ss-settings
    title: Open UE4SS Settings INI
    priority: 200
    target: { openFile: "${ue4ssRootPath}/UE4SS-settings.ini" }

  - id: open-nexus-page
    title: Open Nexus Page
    priority: 201
    target: { openUrl: "https://www.nexusmods.com/phantombladezero" }

nexus:
  modId: 2452            # nexusmods.com/site/mods/2452 (the Vortex extension page)
  # Confirmed present via v1 (/games/site/mods/2452.json → mod_id 2452, game_id 2295,
  # uid 9856949946772, created 2026-10-13) and v2 (name "Phantom Blade Zero Vortex
  # Extension"). Status "not_published" / available: false, expected for an unreleased
  # extension.
  fileGroupId: 8209608
  # NOT verifiable through the API while the page is unpublished and has no files
  # (v1 /files.json returns 403; v2 modFiles returns []). Supplied by the maintainer
  # on 2026-10-22 from the upload page.
  displayName: Phantom Blade Zero Support for Vortex

# ---------------------------------------------------------------------------------------
# CORPUS STATE (2026-10-29, launch day): 35 total (one file each from 35 mod ids; v1 said
# 31 mods minutes earlier, as uploads were still arriving). 32 matched, 3 unmatched, 0
# failed; 18/18 validators pass. Destinations spot-checked against mod pages 1, 5, 7, 8,
# 16, 17, 23 and 35. Unmatched on purpose: mod 2 (UEModManager.exe, a tool), mod 9 (an
# HTML guide only), mod 30 (a Cheat Engine table).
# Known imperfect, left as is:
#   * mod 16 (Thai fonts) ships ten font variants of one pak triplet in sibling folders;
#     `pak` installs the first folder's. Users wanting another font must repack.
#   * mod 26 (LowEnd) bundles Engine.ini with its pak, so the ini lands inert in ~mods
#     (the config-ini pak guard, by design).
# Refresh with:
#     pnpm nx run phantombladezero:test-corpus -- --fetch
# and reconcile `T total` against the v1 `mods` count (docs/corpus-manifests.md).
# ---------------------------------------------------------------------------------------

# Validators encode the intended routing so a rule change can't regress it unnoticed. Each
# is copied from games/starwarszerocompany with the project folder literal changed. gdl
# validators read only `when`, so exclusions are `not` arms inside it.
validators:
  - id: injector-validator
    name: UE4SS loader archives (dwmapi/xinput/UE4SS-settings.ini) match ue4ss-injector
    # Game-relative loader bundles go to `root` by design, so they are excluded here.
    when:
      all:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "ProjectPBZ/**" }
        - not: { hasFile: "Engine/**" }
        - not: { hasFile: "platform/**" }
    assert: { matched: ue4ss-injector }

  - id: reshade-validator
    name: ReShade presets (ReShade.ini, no loader) match reshade
    when:
      all:
        - { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        # Game-relative trees go to root / wrapped-root first (PBZ mod 23 ships ReShade
        # under platform/steam/).
        - not: { hasFile: "**/ProjectPBZ/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "**/platform/**" }
    assert: { matched: reshade }

  - id: ue4ss-cpp-validator
    name: UE4SS C++ mods (dlls/main.dll, no lua, enabled.txt or loader) match ue4ss-cpp
    when:
      all:
        - { hasFile: "**/dlls/main.dll" }
        - not: { hasFile: "**/Scripts/*.lua" }
        - not: { hasFile: "**/enabled.txt" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/ProjectPBZ/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "**/platform/**" }
    assert: { matched: ue4ss-cpp }

  - id: reshade-preset-validator
    name: Bare preset .ini archives (no UE config names, no payload) match reshade-preset
    when:
      all:
        - { hasFile: "**/*.ini" }
        - not: { hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/*.pak" }
        - not: { hasFile: "**/*.utoc" }
        - not: { hasFile: "**/*.dll" }
        - not: { hasFile: "**/*.lua" }
        - not: { hasFile: "**/ProjectPBZ/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "**/platform/**" }
        - not: { hasFile: "**/Binaries/**" }
    assert: { matched: reshade-preset }

  - id: logicmods-validator
    name: LogicMods paks (not loader / game- or project-relative trees) match logicmods
    # The not-arms exclude shapes higher-priority rules legitimately claim first: the
    # loader (15), root (16), wrapped-root (16.5) and content-folder (17).
    when:
      all:
        - { hasFile: "**/LogicMods/**/*.pak" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/ProjectPBZ/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "**/platform/**" }
        - not: { hasFile: "Content/**" }
        - not: { hasFile: "Config/**" }
        - not: { hasFile: "Binaries/**" }
    assert: { matched: logicmods }

  - id: config-validator
    name: Bare Engine.ini archives (no payload) match config-ini
    when:
      all:
        - { hasFile: "**/{Engine.ini,engine.ini}" }
        - not: { hasFile: "**/*.pak" }
        - not: { hasFile: "**/*.utoc" }
        - not: { hasFile: "**/*.dll" }
        - not: { hasFile: "**/*.lua" }
        - not: { hasFile: "ProjectPBZ/**" }
        - not: { hasFile: "Engine/**" }
        - not: { hasFile: "platform/**" }
    assert: { matched: config-ini }

  # Placement guard: IoStore/pak payloads must land under Content/Paks, never loose at the
  # game root, where UE ignores them. Also catches a payload class vanishing from the plan
  # (how the halocampaignevolved mod-68 pak-dropping bug surfaced).
  - id: pak-payload-placement
    name: .pak/.ucas/.utoc install under Content/Paks, never at the game root
    when: { hasFile: "**/*.{pak,ucas,utoc}" }
    assert:
      placement:
        - files: "**/*.{pak,ucas,utoc}"
          mustMatch: "**/Content/Paks/**"
          mustNotMatch: "${installPath}/*"

tests:
  corpus: nexus
  # Cases marked PBZ are real Phantom Blade Zero archive listings (Nexus mod ids, fetched
  # 2026-10-29), abridged where noted. Cases marked BORROWED are real listings from
  # games/starwarszerocompany (mod ids are mods THERE) with the project folder renamed.
  # The rest are SYNTHETIC. Borrowed and synthetic cases pin rule WIRING: priority order,
  # unless-guards and path flattening.
  cases:
    # PBZ mod 5 (UE4SS for Phantom Blade Zero), abridged. Its page says to extract into
    # PBZ/platform/steam, beside the game exe.
    - name: "PBZ ue4ss-injector: UE4SS runtime lands in platform/steam"
      archive:
        - dwmapi.dll
        - ue4ss/UE4SS.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/BPModLoaderMod/Scripts/main.lua
      expect:
        matched: ue4ss-injector
        modType: pbz-ue4ss-injector
        plan:
          - ${installPath}/platform/steam/dwmapi.dll
          - ${installPath}/platform/steam/ue4ss/UE4SS.dll
          - ${installPath}/platform/steam/ue4ss/UE4SS-settings.ini
          - ${installPath}/platform/steam/ue4ss/Mods/BPModLoaderMod/Scripts/main.lua

    # PBZ mod 7 (No-Intro): pak triplet under ProjectPBZ/ plus an ASI loader under
    # platform/steam/. Every file must land, so root takes it whole.
    - name: "PBZ root: ProjectPBZ pak + platform/steam ASI loader deploy intact"
      archive:
        - ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.pak
        - ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.ucas
        - ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.utoc
        - ReadMe.txt
        - Ultimate-ASI-Loader-LICENSE.txt
        - platform/steam/No-Intro.asi
        - platform/steam/winmm.dll
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.pak
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.ucas
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/zzz_No-Intro_P.utoc
          - ${installPath}/ReadMe.txt
          - ${installPath}/Ultimate-ASI-Loader-LICENSE.txt
          - ${installPath}/platform/steam/No-Intro.asi
          - ${installPath}/platform/steam/winmm.dll

    # PBZ mod 33 (MoveSpeed Adjustment): a Lua mod laid out from the install root.
    - name: "PBZ root: Lua mod under platform/steam/ue4ss/Mods deploys intact"
      archive:
        - README.md
        - platform/steam/ue4ss/Mods/PBZMoveSpeed/Scripts/main.lua
        - platform/steam/ue4ss/Mods/PBZMoveSpeed/enabled.txt
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/README.md
          - ${installPath}/platform/steam/ue4ss/Mods/PBZMoveSpeed/Scripts/main.lua
          - ${installPath}/platform/steam/ue4ss/Mods/PBZMoveSpeed/enabled.txt

    # PBZ mod 35 (controller preset): replaces the input settings save in the install.
    - name: "PBZ root: input settings .sav into ProjectPBZ/Saved"
      archive:
        - ProjectPBZ/Saved/EnhancedInputUserSettings.sav
        - README_EN.txt
        - README_zh-CN.txt
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ProjectPBZ/Saved/EnhancedInputUserSettings.sav
          - ${installPath}/README_EN.txt
          - ${installPath}/README_zh-CN.txt

    # PBZ mod 17 (PBZ Pause, UE4SS file): a C++ mod with no enabled.txt.
    - name: "PBZ ue4ss-cpp: dlls/main.dll mod into ue4ss/Mods"
      archive:
        - ue4ss/Mods/PBZPause/dlls/config.ini
        - ue4ss/Mods/PBZPause/dlls/main.dll
      expect:
        matched: ue4ss-cpp
        modType: pbz-ue4ss
        plan:
          - ${installPath}/platform/steam/ue4ss/Mods/PBZPause/dlls/config.ini
          - ${installPath}/platform/steam/ue4ss/Mods/PBZPause/dlls/main.dll

    # PBZ mod 4 (Vibrant Reshade): a bare preset goes beside the game exe.
    - name: "PBZ reshade-preset: bare preset into platform/steam"
      archive:
        - Vibrant Reshade - Phantom Blade Zero ReadMe.txt
        - Vibrant Reshade - Phantom Blade Zero.ini
      expect:
        matched: reshade-preset
        modType: pbz-binaries
        plan:
          - ${installPath}/platform/steam/Vibrant Reshade - Phantom Blade Zero ReadMe.txt
          - ${installPath}/platform/steam/Vibrant Reshade - Phantom Blade Zero.ini

    # PBZ mod 1 (Remove Fog): a lone Engine.ini to the AppData config dir.
    - name: "PBZ config-ini: Engine.ini to LocalAppData ProjectPBZ config"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: pbz-config
        plan:
          - ${appDataLocal}/ProjectPBZ/Saved/Config/Windows/Engine.ini

    # BORROWED, starwarszerocompany mod 9 (stock UE4SS bundle), abridged. The whole tree
    # lands in Binaries/, nested lua included, rather than ue4ss-lua claiming the lua.
    - name: "ue4ss-injector: stock UE4SS bundle into Binaries"
      archive:
        - dwmapi.dll
        - README.txt
        - ue4ss/UE4SS.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/mods.txt
        - ue4ss/Mods/BPModLoaderMod/Scripts/main.lua
      expect:
        matched: ue4ss-injector
        modType: pbz-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/README.txt
          - ${binariesPath}/ue4ss/UE4SS.dll
          - ${binariesPath}/ue4ss/UE4SS-settings.ini
          - ${binariesPath}/ue4ss/Mods/mods.txt
          - ${binariesPath}/ue4ss/Mods/BPModLoaderMod/Scripts/main.lua

    # BORROWED, starwarszerocompany mods 2 and 7: a lone Engine.ini at the archive root.
    - name: "config-ini: bare Engine.ini to the user config dir"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: pbz-config
        plan:
          - ${configPath}/Engine.ini

    # BORROWED, starwarszerocompany mod 16: a bare lowercase game.ini. Pins the brace-list
    # agreement between config-ini and reshade-preset; it shipped mis-routed there once.
    - name: "config-ini: bare game.ini to the user config dir, not Binaries"
      archive:
        - game.ini
      expect:
        matched: config-ini
        modType: pbz-config
        plan:
          - ${configPath}/game.ini

    # BORROWED, starwarszerocompany mod 12: a lone preset .ini named after itself.
    - name: "reshade-preset: bare preset ini into Binaries"
      archive:
        - ZeroCompanyReshadeByScottyus1.ini
      expect:
        matched: reshade-preset
        modType: pbz-binaries
        plan:
          - ${binariesPath}/ZeroCompanyReshadeByScottyus1.ini

    # BORROWED, starwarszerocompany mod 34: a UE4SS mod keyed by enabled.txt with a dll
    # payload, which ue4ss-lua does not see.
    - name: "ue4ss-lua-enabled: enabled.txt + dll payload into ue4ss/Mods"
      archive:
        - ue4ss/Mods/ZCUnlocked/enabled.txt
        - ue4ss/Mods/ZCUnlocked/dlls/main.dll
        - README.txt
      expect:
        matched: ue4ss-lua-enabled
        modType: pbz-ue4ss

    # BORROWED SHAPE, starwarszerocompany mod 11 ("Thai Mod"): the game tree wrapped in a
    # version-named folder with a dsound proxy and a pak. The project folder is renamed and
    # the file names are generalised (the real ones are README_TH.txt and ThaiFont_P.pak). wrapped-root keeps every file.
    # Plan paths are modType-relative because stripCommonRoot emits relative destinations.
    - name: "wrapped-root: wrapped tree with loader + pak keeps every file"
      archive:
        - Translation_Mod_v1.2/README.txt
        - Translation_Mod_v1.2/ProjectPBZ/Binaries/Win64/dsound.dll
        - Translation_Mod_v1.2/ProjectPBZ/Content/Paks/Font_P.pak
      expect:
        matched: wrapped-root
        modType: pbz-root
        plan:
          - README.txt
          - ProjectPBZ/Binaries/Win64/dsound.dll
          - ProjectPBZ/Content/Paks/Font_P.pak

    # BORROWED, starwarszerocompany mod 39: several numbered pak triplets flatten into ~mods
    # together, keeping the 010_/020_ load-order prefixes.
    - name: "pak: multiple numbered triplets flatten into ~mods"
      archive:
        - 010_classes_unlocked_P.pak
        - 010_classes_unlocked_P.ucas
        - 010_classes_unlocked_P.utoc
        - 020_classes_picker_P.pak
        - 020_classes_picker_P.ucas
        - 020_classes_picker_P.utoc
      expect:
        matched: pak
        modType: pbz-pak
        plan:
          - ${pakModsPath}/010_classes_unlocked_P.pak
          - ${pakModsPath}/010_classes_unlocked_P.ucas
          - ${pakModsPath}/010_classes_unlocked_P.utoc
          - ${pakModsPath}/020_classes_picker_P.pak
          - ${pakModsPath}/020_classes_picker_P.ucas
          - ${pakModsPath}/020_classes_picker_P.utoc

    # BORROWED, starwarszerocompany mod 10, project folder renamed: a MIXED game-relative
    # archive. `root` keeps the splash and README that a pak rule would drop.
    - name: "root: mixed pak triplet + splash + readme deploys intact"
      archive:
        - ReadMe.txt
        - ProjectPBZ/Content/Paks/~mods/No-Intro_P.pak
        - ProjectPBZ/Content/Paks/~mods/No-Intro_P.ucas
        - ProjectPBZ/Content/Paks/~mods/No-Intro_P.utoc
        - ProjectPBZ/Content/Splash/Splash.bmp
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ReadMe.txt
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/No-Intro_P.pak
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/No-Intro_P.ucas
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/No-Intro_P.utoc
          - ${installPath}/ProjectPBZ/Content/Splash/Splash.bmp

    # GUARD: reshade-preset must not steal an Engine.ini from config-ini. Removing either
    # the priority order or the unless arm fails this.
    - name: "reshade-preset guard: Engine.ini stays with config-ini"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: pbz-config

    # GUARD: a flat loader archive carrying a stray pak is taken whole by ue4ss-injector, so
    # the pak lands inert in Binaries/. Pinned inherited behaviour; pak-payload-placement
    # flags it if a real mod ever has this shape.
    - name: "ue4ss-injector: flat loader archive with a stray pak is taken whole (pinned)"
      archive:
        - dwmapi.dll
        - UE4SS-settings.ini
        - Stray_P.pak
      expect:
        matched: ue4ss-injector
        modType: pbz-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/UE4SS-settings.ini
          - ${binariesPath}/Stray_P.pak

    # SYNTHETIC from here on.
    - name: "reshade: preset folder stripped into Binaries"
      archive:
        - WarmSun/ReShade.ini
        - WarmSun/WarmSun.ini
        - WarmSun/reshade-shaders/Shaders/Clarity.fx
      expect:
        matched: reshade
        modType: pbz-binaries
        plan:
          - ${binariesPath}/ReShade.ini
          - ${binariesPath}/WarmSun.ini
          - ${binariesPath}/reshade-shaders/Shaders/Clarity.fx

    - name: "native-dll: bare dll placed in Binaries"
      archive:
        - SomePlugin.dll
      expect:
        matched: native-dll
        modType: pbz-binaries
        plan:
          - ${binariesPath}/SomePlugin.dll

    - name: "ue4ss-lua: lua mod with Scripts folder"
      archive:
        - MyMod/Scripts/main.lua
        - MyMod/enabled.txt
      expect:
        matched: ue4ss-lua
        modType: pbz-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/enabled.txt

    - name: "logicmods: paks under LogicMods/ folder"
      archive:
        - Pack/LogicMods/BPFolder/X.pak
      expect:
        matched: logicmods
        modType: pbz-logicmods
        plan:
          - ${paksPath}/LogicMods/BPFolder/X.pak

    - name: "config-ini: lowercase engine.ini in a named wrapper folder is stripped"
      archive:
        - Smooth Framerate/engine.ini
        - Smooth Framerate/README.txt
      expect:
        matched: config-ini
        modType: pbz-config
        plan:
          - ${configPath}/engine.ini
          - ${configPath}/README.txt

    # GUARD: the config-ini `unless: **/*.pak` arm. Without it this archive is reduced to a
    # config drop and the pak is lost.
    - name: "config-ini guard: Engine.ini bundled WITH a pak keeps its pak routing"
      archive:
        - MyMod/Engine.ini
        - MyMod/MyMod_P.pak
      expect:
        matched: pak
        modType: pbz-pak
        plan:
          - ${pakModsPath}/MyMod_P.pak
          - ${pakModsPath}/Engine.ini

    - name: "pak: single pak file flattened to ~mods"
      archive:
        - SomeMod/Cool.pak
      expect:
        matched: pak
        modType: pbz-pak
        plan:
          - ${pakModsPath}/Cool.pak

    # A .pak alongside .utoc/.ucas must route to `pak` (30), not `pak-iostore` (29).
    - name: "pak: pak wins over pak-iostore when both present"
      archive:
        - Better Stacks/0_BetterStacks_P.pak
        - Better Stacks/0_BetterStacks_P.ucas
        - Better Stacks/0_BetterStacks_P.utoc
      expect:
        matched: pak
        modType: pbz-pak
        plan:
          - ${pakModsPath}/0_BetterStacks_P.pak
          - ${pakModsPath}/0_BetterStacks_P.ucas
          - ${pakModsPath}/0_BetterStacks_P.utoc

    - name: "pak-iostore: utoc+ucas without a pak"
      archive:
        - SomeMod/x_P.utoc
        - SomeMod/x_P.ucas
      expect:
        matched: pak-iostore
        modType: pbz-pak
        plan:
          - ${pakModsPath}/x_P.utoc
          - ${pakModsPath}/x_P.ucas

    - name: "pak-alt: bundled Paks/ folder → Content/Paks"
      archive:
        - mod/Paks/sub/x.pak
        - mod/Paks/sub/x.ucas
        - mod/Paks/sub/x.utoc
      expect:
        matched: pak-alt
        modType: pbz-pakalt
        plan:
          - ${contentPath}/Paks/sub/x.pak
          - ${contentPath}/Paks/sub/x.ucas
          - ${contentPath}/Paks/sub/x.utoc

    - name: "content-folder: Content/ at archive root"
      archive:
        - Content/Foo.uasset
        - Content/Bar.uexp
      expect:
        matched: content-folder
        modType: pbz-contentfolder
        plan:
          - ${gamePath}/Content/Foo.uasset
          - ${gamePath}/Content/Bar.uexp

    - name: "root: project folder + Engine segments deploy intact"
      archive:
        - ProjectPBZ/Content/Paks/foo.pak
        - Engine/Content/bar.uasset
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ProjectPBZ/Content/Paks/foo.pak
          - ${installPath}/Engine/Content/bar.uasset

    # GUARD: the ue4ss-injector `unless` arm. A game-relative archive shipping the loader AND
    # a pak must go to `root`, or the pak outside Binaries/ is dropped (halo mod 68).
    - name: "injector guard: game-relative loader + pak deploys intact via root"
      archive:
        - ProjectPBZ/Binaries/Win64/dwmapi.dll
        - ProjectPBZ/Binaries/Win64/ue4ss/UE4SS-settings.ini
        - ProjectPBZ/Content/Paks/~mods/Payload_P.pak
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ProjectPBZ/Binaries/Win64/dwmapi.dll
          - ${installPath}/ProjectPBZ/Binaries/Win64/ue4ss/UE4SS-settings.ini
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/Payload_P.pak

    # GUARD: wrapped-root. Without it this archive matches nothing and installs zero files.
    - name: "wrapped-root: game tree wrapped in a mod-name folder has the wrapper stripped"
      archive:
        - Cool Mod v2/ProjectPBZ/Content/Paks/~mods/Cool_P.pak
        - Cool Mod v2/README.txt
      expect:
        matched: wrapped-root
        modType: pbz-root
        plan:
          - README.txt
          - ProjectPBZ/Content/Paks/~mods/Cool_P.pak

    # GUARD: the converse. An unwrapped tree stays with `root`, or stripCommonRoot would eat
    # the project-folder segment and deploy one level too high.
    - name: "root still wins for an unwrapped tree (wrapped-root declines)"
      archive:
        - ProjectPBZ/Content/Paks/~mods/Cool_P.pak
        - README.txt
      expect:
        matched: root
        modType: pbz-root
        plan:
          - ${installPath}/ProjectPBZ/Content/Paks/~mods/Cool_P.pak
          - ${installPath}/README.txt
