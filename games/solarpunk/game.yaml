gdl: 1
version: 1.0.0   # extension version — drives info.json, the release tag, and the zip name

# Solarpunk (rokaplay / Cyberwave) — Unreal Engine 5 (5.7.x), IoStore paks.
# Supports: pak mods (Content/Paks/~mods), LogicMods, UE4SS (loader + Lua mods),
# ReShade presets, loose native DLL plugins, and whole-folder "root" mods.
# UE4SS is known to run on this build (a pre-patched UE4SS v3.0.1 ships on Nexus).

game:
  id: solarpunk
  name: Solarpunk
  # UE bootstrap shim at the install root, NOT the shipping exe — Steam's real binary is
  # Solarpunk/Binaries/Win64/SolarpunkSteam-Win64-Shipping.exe (OriginalFilename
  # BootstrapPackagedGame-Win64-Shipping.exe on the shim).
  #
  # Deliberately NOT storeBranch'd, and a real Game Pass install proves why: the shim ships
  # on Xbox too, at the same relative path (Solarpunk.exe at the Content root, same 230,400
  # bytes), while the nested shipping exe is renamed per store —
  #   Steam: Binaries/Win64/SolarpunkSteam-Win64-Shipping.exe
  #   Xbox:  Binaries/WinGDK/Solarpunk-WinGDK-Shipping.exe      (target loses "Steam")
  # Branching onto the nested path would have meant guessing that rename, and a wrong
  # `executable` makes Vortex silently report getGameVersion as 0.0.0. The shim abstracts
  # it away. Verified on D:\XboxGames\Solarpunk 2026-07-27.
  executable: Solarpunk.exe
  requiredFiles: [Solarpunk.exe]
  # Required for Game Pass: without it Vortex bare-spawns the exe, which a GDK build
  # rejects — and reports as a SUCCESSFUL launch, so the Play button silently does nothing.
  # appId comes from stores.xbox below; appExecName is the package's Application/@Id,
  # confirmed from the appxmanifest.xml of a real Game Pass install (and independently from
  # the store catalog, product 9N8BRH7PGJMJ).
  xboxLauncher: { appExecName: AppSolarpunkShipping }
  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: solarpunk
  details:
    supportsSymlinks: true
    gameProjectFolder: Solarpunk
    ignoreConflicts: [UE4SS-settings.ini, enabled.txt]

stores:
  steam: "1805110"
  # Epic value is the manifest AppName (Vortex matches IGameStoreEntry.appid == AppName).
  epic: "408e96c974c54d478cb18296164dcbfe"
  # Xbox value is the package Identity Name (Vortex matches the appsFolder key before '_').
  # Store listing id is 9N8BRH7PGJMJ; package family is rokapublish.Solarpunk_6q4vfhsywtz4j.
  # VERIFIED on a real Game Pass install 2026-07-27 (D:\XboxGames\Solarpunk): the
  # appxmanifest's Identity/@Name is exactly this value, the discovered root is the Content
  # folder (holding Solarpunk.exe + the Solarpunk/ project folder + Engine/, as on Steam),
  # and Binaries/WinGDK exists as `arch` below expects. Supersedes the earlier note that the
  # layout was unverified and inferred from Subnautica 2.
  xbox: "rokapublish.Solarpunk"

context:
  # Binaries arch differs by store: WinGDK on Xbox/Game Pass, Win64 on Steam/Epic.
  arch:
    storeBranch:
      xbox: WinGDK
      default: Win64
  # The UE project nests under a Solarpunk/ folder beneath the discovered install
  # path on EVERY store — including Xbox/Game Pass, where the discovered path is the
  # ...\Content folder (it holds Solarpunk.exe plus the Solarpunk/ project folder).
  # Verified directly on a Solarpunk Game Pass install 2026-07-27 (previously this was
  # inferred from Subnautica 2). Only `arch` differs (above): Binaries/WinGDK confirmed
  # present, and Content/Paks resolves identically to Steam.
  gamePath: ${installPath}/Solarpunk

  pakModsPath:   ${gamePath}/Content/Paks/~mods
  logicModsPath: ${gamePath}/Content/Paks/LogicMods
  paksPath:      ${gamePath}/Content/Paks
  contentPath:   ${gamePath}/Content

  # UE4SS / ReShade / loose DLL plugins all live next to the shipping exe.
  binariesPath:  ${gamePath}/Binaries/${arch}
  ue4ssRootPath: ${gamePath}/Binaries/${arch}/ue4ss
  ue4ssModsPath: ${gamePath}/Binaries/${arch}/ue4ss/Mods

modTypes:
  - { id: solarpunk-pak,            name: "Paks (~mods)",               path: "${pakModsPath}" }
  # Deploys under Content/Paks; the LogicMods/ subfolder rides along in each
  # file's stripped relative path (so placeAt == this path; see GDL114).
  - { id: solarpunk-logicmods,      name: "LogicMods (Blueprint paks)", path: "${paksPath}" }
  - { id: solarpunk-ue4ss,          name: "UE4SS (Lua mods)",           path: "${ue4ssModsPath}" }
  - { id: solarpunk-ue4ss-injector, name: "UE4SS (loader)",             path: "${binariesPath}" }
  - { id: solarpunk-binaries,       name: "Binaries (ReShade / DLL plugins)", path: "${binariesPath}" }
  - { id: solarpunk-root,           name: "Root (game folder)",         path: "${installPath}" }
  - { id: solarpunk-contentfolder,  name: "Content folder",             path: "${gamePath}" }
  # Deploys under Content/; the Paks/ subfolder rides along in each file's
  # stripped relative path (so placeAt == this path; see GDL114).
  - { id: solarpunk-pakalt,         name: "Paks (no ~mods)",            path: "${contentPath}" }

installers:
  # --- Priority 15: UE4SS loader (dwmapi/xinput proxy or UE4SS-settings.ini) → Binaries ---
  # The `unless` is load-bearing, not defensive. This rule's `take: parent` resolves the
  # install root to Solarpunk/Binaries/<arch>, and stripPath drops every file outside that
  # subtree (gdl/src/runtime/installer-engine.ts:101-151). So an archive laid out from the
  # install root that ships the loader AND other payload (a pak under Content/Paks/, say)
  # would lose everything outside Binaries/ — silently. Declining here hands it to `root`
  # (16), which deploys the tree intact. Found on halocampaignevolved mod 68, where exactly
  # this dropped a three-file pak triplet; latent here, so guarded before it bites.
  - id: ue4ss-injector
    priority: 15
    when: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "Solarpunk/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: parent
    placeAt: "${binariesPath}"
    modType: solarpunk-ue4ss-injector

  # --- Priority 18: ReShade preset (ReShade.ini, strip wrapper) → Binaries ---
  - id: reshade
    priority: 18
    when: { hasFile: "**/ReShade.ini" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/ReShade.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: solarpunk-binaries

  # --- Priority 20: LogicMods (Blueprint paks under LogicMods/) → Content/Paks ---
  - id: logicmods
    priority: 20
    when: { hasFile: "**/LogicMods/**" }
    anchor: "**/LogicMods/"
    take: self
    placeAt: "${paksPath}"
    modType: solarpunk-logicmods

  # --- Priority 22: UE4SS Lua (Scripts/*.lua present) → ue4ss/Mods ---
  - id: ue4ss-lua
    priority: 22
    when: { hasFile: "**/Scripts/*.lua" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/Scripts/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: solarpunk-ue4ss

  # --- Priority 23: UE4SS Lua (enabled.txt only) → ue4ss/Mods ---
  - id: ue4ss-lua-enabled
    priority: 23
    when: { hasFile: "**/enabled.txt" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/enabled.txt"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: solarpunk-ue4ss

  # --- Priority 24: UE4SS Lua (bare .lua, no Scripts/ dir) → ue4ss/Mods ---
  - id: ue4ss-lua-bare
    priority: 24
    when: { hasFile: "**/*.lua" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: solarpunk-ue4ss

  # --- Priority 16: Root (game-relative archives laid out from the install root) ---
  # Positioned AFTER the UE4SS loader (so injector packages keep their handling)
  # but BEFORE logicmods/ue4ss-lua/pak. When an archive is arranged from the
  # install root (top-level Solarpunk/ or Engine/), the whole tree deploys as-is,
  # so a MIXED mod (lua under Binaries/ + a pak under Content/Paks/) lands every
  # file in place instead of ue4ss-lua claiming it and dropping the pak.
  - id: root
    priority: 16
    when:
      any:
        - { hasFile: "Solarpunk/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: solarpunk-root

  # --- Priority 17: Content folder (project-relative trees: Content/, Config/, Binaries/) ---
  # Sibling of `root` for archives laid out from the project folder rather than
  # the install root. Whole tree deploys to ${gamePath}, so a bare Binaries/ tree
  # correctly lands under the project folder.
  - id: content-folder
    priority: 17
    when:
      any:
        - { hasFile: "Content/**" }
        - { hasFile: "Config/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${gamePath}"
    modType: solarpunk-contentfolder

  # --- Priority 27: Loose native DLL plugin (e.g. winmm/dll-injector mods) → Binaries ---
  - id: native-dll
    priority: 27
    when: { hasFile: "**/*.dll" }
    unless:
      any:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/ue4ss/**" }
        - { hasFile: "**/ReShade.ini" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/Solarpunk/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.dll"
    take: parent
    placeAt: "${binariesPath}"
    modType: solarpunk-binaries

  # --- Priority 28: A Paks/ folder bundled in the archive (not ~mods) → Content/Paks ---
  - id: pak-alt
    priority: 28
    when:
      all:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Paks/**" }
    unless:
      any:
        - { hasFile: "**/~mods/**" }
        - { hasFile: "**/LogicMods/**" }
        - { hasFile: "**/Solarpunk/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/Paks/"
    take: self
    placeAt: "${contentPath}"
    modType: solarpunk-pakalt

  # --- Priority 29: IO Store mod (utoc/ucas without a .pak) → ~mods ---
  - id: pak-iostore
    priority: 29
    when: { hasFile: "**/*.utoc" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Solarpunk/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.utoc"
    take: parent
    placeAt: "${pakModsPath}"
    modType: solarpunk-pak

  # --- Priority 30: Default pak mod → flatten into ~mods ---
  - id: pak
    priority: 30
    when: { hasFile: "**/*.pak" }
    unless:
      any:
        - { hasFile: "**/Solarpunk/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.pak"
    take: parent
    placeAt: "${pakModsPath}"
    modType: solarpunk-pak

setup:
  ensureDirs:
    - ${pakModsPath}

toolbarActions:
  - id: open-ue4ss-settings
    title: Open UE4SS Settings INI
    priority: 200
    target: { openFile: "${ue4ssRootPath}/UE4SS-settings.ini" }

  - id: open-nexus-page
    title: Open Nexus Page
    priority: 201
    target: { openUrl: "https://www.nexusmods.com/solarpunk" }

nexus:
  modId: 1975            # nexusmods.com/site/mods/1975 (the Vortex extension page)
  fileGroupId: 7517603
  displayName: Solarpunk Support for Vortex

# Corpus validators: assertions checked against real Nexus archives via
# `gdl test:corpus --fetch` (needs NEXUS_API_KEY). They guard the routing of the
# real day-one mod categories against rule regressions.
validators:
  - id: injector-validator
    name: UE4SS loader archives (dwmapi/xinput/UE4SS-settings.ini) match ue4ss-injector
    # Game-relative loader bundles are claimed by `root` by design (see installer 15), so
    # they're excluded here — pak-payload-placement covers their payload instead.
    when:
      all:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "Solarpunk/**" }
        - not: { hasFile: "Engine/**" }
    assert: { matched: ue4ss-injector }

  - id: reshade-validator
    name: ReShade presets (ReShade.ini, no loader) match reshade
    when:
      all:
        - { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    assert: { matched: reshade }

  - id: logicmods-validator
    name: Archives with LogicMods paks match logicmods
    when: { hasFile: "**/LogicMods/**/*.pak" }
    assert: { matched: logicmods }

  - id: ue4ss-lua-validator
    name: Bare lua mods (Scripts/*.lua, no loader, not game-relative) match ue4ss-lua
    when:
      all:
        - { hasFile: "**/Scripts/*.lua" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        # Game-relative archives are claimed by root/content-folder and deploy intact.
        - not: { hasFile: "Solarpunk/**" }
        - not: { hasFile: "Engine/**" }
        - not: { hasFile: "Content/**" }
        - not: { hasFile: "Binaries/**" }
    assert: { matched: ue4ss-lua }

  # Placement guard: regardless of which pak installer wins, IoStore pak payloads
  # must land under Content/Paks and never loose at the game-folder root (a .ucas
  # at the root is silently ignored by UE and is a common mis-route).
  - id: pak-payload-placement
    name: .pak/.ucas/.utoc install under Content/Paks, never at the game root
    when: { hasFile: "**/*.{pak,ucas,utoc}" }
    assert:
      placement:
        - files: "**/*.{pak,ucas,utoc}"
          mustMatch: "**/Content/Paks/**"
          mustNotMatch: "${installPath}/*"

tests:
  corpus: nexus
  cases:
    # --- UE4SS loader (real shape: UE4SS Solarpunk, mod 4) ---
    - name: "ue4ss-injector: dwmapi.dll + ue4ss tree dropped into Binaries"
      archive:
        - dwmapi.dll
        - tbb12.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/keep_me.txt
      expect:
        matched: ue4ss-injector
        modType: solarpunk-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/tbb12.dll
          - ${binariesPath}/ue4ss/UE4SS-settings.ini
          - ${binariesPath}/ue4ss/Mods/keep_me.txt

    # --- ReShade preset (real shape: WarmSun, mod 1) ---
    - name: "reshade: preset folder stripped into Binaries"
      archive:
        - WarmSun/ReShade.ini
        - WarmSun/WarmSun.ini
        - WarmSun/reshade-shaders/Shaders/Clarity.fx
      expect:
        matched: reshade
        modType: solarpunk-binaries
        plan:
          - ${binariesPath}/ReShade.ini
          - ${binariesPath}/WarmSun.ini
          - ${binariesPath}/reshade-shaders/Shaders/Clarity.fx

    # --- Loose native DLL plugin (real shape: AirshipShare, mod 5) ---
    - name: "native-dll: bare dll placed in Binaries"
      archive:
        - AirshipShare.dll
      expect:
        matched: native-dll
        modType: solarpunk-binaries
        plan:
          - ${binariesPath}/AirshipShare.dll

    # --- UE4SS Lua ---
    - name: "ue4ss: lua mod with Scripts folder"
      archive:
        - MyMod/Scripts/main.lua
        - MyMod/enabled.txt
      expect:
        matched: ue4ss-lua
        modType: solarpunk-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/enabled.txt

    # --- LogicMods ---
    - name: "logicmods: paks under LogicMods/ folder"
      archive:
        - Pack/LogicMods/BPFolder/X.pak
      expect:
        matched: logicmods
        modType: solarpunk-logicmods
        plan:
          - ${paksPath}/LogicMods/BPFolder/X.pak

    # --- Pak mods (real shape: No Intro / Better Stacks, mods 2 & 3) ---
    - name: "pak: single pak file flattened to ~mods"
      archive:
        - SomeMod/Cool.pak
      expect:
        matched: pak
        modType: solarpunk-pak
        plan:
          - ${pakModsPath}/Cool.pak

    - name: "pak: pak+ucas+utoc triplet flattened"
      archive:
        - SomeMod/files/x_P.pak
        - SomeMod/files/x_P.ucas
        - SomeMod/files/x_P.utoc
      expect:
        matched: pak
        modType: solarpunk-pak
        plan:
          - ${pakModsPath}/x_P.pak
          - ${pakModsPath}/x_P.ucas
          - ${pakModsPath}/x_P.utoc

    # Exact real-world shape of "Better Stacks" (mod 3): a .pak alongside .utoc/.ucas
    # must route to `pak` (not `pak-iostore`, whose `unless: **/*.pak` excludes it)
    # and flatten the wrapping folder into ~mods.
    - name: "pak: Better Stacks (real archive — pak wins over pak-iostore)"
      archive:
        - Better Stacks/0_BetterStacks_P.pak
        - Better Stacks/0_BetterStacks_P.ucas
        - Better Stacks/0_BetterStacks_P.utoc
      expect:
        matched: pak
        modType: solarpunk-pak
        plan:
          - ${pakModsPath}/0_BetterStacks_P.pak
          - ${pakModsPath}/0_BetterStacks_P.ucas
          - ${pakModsPath}/0_BetterStacks_P.utoc

    - name: "pak-iostore: utoc+ucas without a pak"
      archive:
        - SomeMod/x_P.utoc
        - SomeMod/x_P.ucas
      expect:
        matched: pak-iostore
        modType: solarpunk-pak
        plan:
          - ${pakModsPath}/x_P.utoc
          - ${pakModsPath}/x_P.ucas

    - name: "pak-alt: bundled Paks/ folder → Content/Paks"
      archive:
        - mod/Paks/sub/x.pak
        - mod/Paks/sub/x.ucas
        - mod/Paks/sub/x.utoc
      expect:
        matched: pak-alt
        modType: solarpunk-pakalt
        plan:
          - ${contentPath}/Paks/sub/x.pak
          - ${contentPath}/Paks/sub/x.ucas
          - ${contentPath}/Paks/sub/x.utoc

    - name: "content-folder: Content/ at archive root"
      archive:
        - Content/Foo.uasset
        - Content/Bar.uexp
      expect:
        matched: content-folder
        modType: solarpunk-contentfolder
        plan:
          - ${gamePath}/Content/Foo.uasset
          - ${gamePath}/Content/Bar.uexp

    - name: "root: Solarpunk + Engine segments"
      archive:
        - Solarpunk/Content/Paks/foo.pak
        - Engine/Content/bar.uasset
      expect:
        matched: root
        modType: solarpunk-root
        plan:
          - ${installPath}/Solarpunk/Content/Paks/foo.pak
          - ${installPath}/Engine/Content/bar.uasset

    # --- Mixed game-relative mod (UE4SS lua + asset-replacement pak) ---
    # A single archive laid out from the install root carrying BOTH a UE4SS Lua
    # payload and a pak must deploy as one intact tree — the pak must NOT be
    # dropped by the narrower ue4ss-lua installer claiming the archive.
    - name: "root: mixed lua+pak game-relative archive keeps paks"
      archive:
        - Solarpunk/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
        - Solarpunk/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
        - Solarpunk/Content/Paks/~mods/Foo_P.pak
      expect:
        matched: root
        modType: solarpunk-root
        plan:
          - ${installPath}/Solarpunk/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
          - ${installPath}/Solarpunk/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
          - ${installPath}/Solarpunk/Content/Paks/~mods/Foo_P.pak
