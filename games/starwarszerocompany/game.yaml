gdl: 1
version: 0.0.1   # extension version — drives info.json, the release tag, and the zip name

# Star Wars: Zero Company (Bit Reactor / Electronic Arts) — single-player turn-based tactics.
# Steam app 2075800; Nexus domain starwarszerocompany (game id 9861).
#
# ============================ SCAFFOLDED PRE-RELEASE ============================
# Scaffolded UNRELEASED (2026-08-18) with the project folder, exe and config leaf all
# placeholders — at that point the SteamCMD appinfo had releasestate=prerelease with NO
# installdir, NO depots and NO launch config.
#
# UPDATED 2026-08-24: Steam published the real depot + launch config (releasestate is
# now `preloadonly`, preload live ahead of the 2026-08-27 release), which resolved most
# of the unknowns. Source: SteamCMD appinfo for app 2075800, read via
# api.steamcmd.net/v1/info/2075800 (steamdb.info shows the same data but 403s scripted
# access — Cloudflare). Observed there:
#   * installdir "Star Wars Zero Company"; depot 2075801, public manifest
#     1924520330706248107, ~42.6 GB installed.
#   * The default (and valve_review) branch launches SWZeroCompany.exe at the INSTALL
#     ROOT, args `-slnoota` — the usual UE root bootstrap, same shape as games/solarpunk.
#   * The UE project folder is `Bruno` — Bit Reactor's internal codename, visible in the
#     internal-branch launch paths (`Development\Bruno\Binaries\Win64\Bruno.exe`,
#     `Test\Bruno\Binaries\Win64\Bruno-Win64-Test.exe`). Those branches wrap a whole
#     build in a Development\/Test\ folder next to its own SWZeroCompany.exe bootstrap,
#     so the default branch's root layout is SWZeroCompany.exe + Bruno/ (+ Engine/).
#     The codename also retro-explains the Epic artifactId "bruno" (see the stores
#     block) and the `br.*` cvars / `BR_Automation_Root` map in the launch arguments.
#
# Read this before editing: a wrong path in this file still BUILDS GREEN and TESTS
# GREEN. The unit cases below assert rule wiring against synthetic archive shapes, and
# the corpus cannot help yet (see the corpus-state note further down), so nothing in CI
# will catch a bad path. Anything still inferred rather than observed is marked
# `# UNVERIFIED` on its own line (precedent: games/outward2/game.yaml).
#
# STILL OUTSTANDING at release:
#   1. Spot-check the layout on a real install. The depot FILE LIST itself has not been
#      read (preload depots are encrypted; steamdb blocks scripted access), so `Bruno`
#      as the shipping project folder is observed-from-launch-config, not
#      observed-on-disk. Same for Engine/ existing at the root (standard UE packaging,
#      but assumed).
#   2. Confirm the Saved/Config/<TargetPlatform> leaf on a real install (see
#      context.configPath — the leaf VARIES per game; `Windows` is assumed).
#   3. Re-run the corpus once real mods exist and promote the shapes it finds into
#      tests.cases, replacing the illustrative ones (still blocked as of 2026-08-24 —
#      see the corpus-state note at the bottom).
# The `nexus:` block already has the real extension-page ids (2026-08-19), so this file
# is PUBLISHABLE: a `version:` bump merged to main will actually ship to Nexus. Do not
# bump until step 1 above is done against a real install.
#
# Engine: Unreal Engine — now confirmed by a primary source: Steam's own launch config
# uses UE packaged-build paths (`Bruno\Binaries\Win64\Bruno-Win64-Test.exe` is UE's
# <Project>\Binaries\<Platform>\<Project>-<Platform>-<Config>.exe naming). That it is
# UE **5** specifically remains corroborated inference (press/job-listing/UMG evidence,
# 2026-08-18) rather than observed — it matters only to the IoStore assumptions in the
# pak installers, which a UE4 build would weaken but not break.
#
# MOD SUPPORT CAVEAT: Bit Reactor Lead Producer Caydence Funk, on EA's own site
# (ea.com/games/starwars/zero-company/news/answering-biggest-questions): "We have a lot
# of respect for the modding community, but there is no official mod support planned
# for Star Wars: Zero Company." That does not stop Vortex supporting the game — most of
# this repo covers games with no official support — but it does mean the community mod
# SHAPE is unpredictable. With no sanctioned pak pipeline, mods may skew toward UE4SS
# and dll injection rather than the pak-heavy distribution these rules assume. Re-check
# the priority ladder against reality once mods actually appear.
#
# Supports (standard UE5 stack, inherited from games/halocampaignevolved): pak mods
# (Content/Paks/~mods), LogicMods, UE4SS (loader + Lua mods), ReShade presets, loose
# native DLL plugins, Engine.ini config tweaks, and whole-folder "root" mods.
# ===============================================================================

game:
  id: starwarszerocompany
  name: Star Wars Zero Company   # no colon — see the displayName note in the nexus block below
  # Root bootstrap, verified 2026-08-24: the default-branch Steam launch entry is
  # `SWZeroCompany.exe` at the install root (appinfo launch config — see header). Same
  # root-launcher shape as games/solarpunk. The nested shipping exe is presumably
  # Bruno/Binaries/Win64/Bruno-Win64-Shipping.exe (the Test branch shows
  # Bruno-Win64-Test.exe), but Vortex should launch the bootstrap Steam launches. A
  # scalar (not a storeBranch) is correct because only Steam is declared.
  executable: SWZeroCompany.exe

  # Same file as executable: a root exe exists at an identical path regardless of arch, so
  # it is a safe fingerprint. NOTE for release: requiredFiles is a discovery FINGERPRINT,
  # not the launch target, and every entry must exist (no globs). If other stores are
  # added, prefer a marker at an identical relative path on every store — for UE5 usually
  # <Project>/Content/Paks/global.utoc. Do NOT list both arch paths: all-must-exist means
  # that breaks every store. See recipe §2.
  requiredFiles: [SWZeroCompany.exe]

  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: starwarszerocompany
  details:
    supportsSymlinks: true
    gameProjectFolder: Bruno   # internal codename — observed in branch launch paths, see header
    ignoreConflicts: [UE4SS-settings.ini, enabled.txt]

# Steam is the only confirmed store.
#   steam  — 2075800, confirmed via the Steam storesearch API and appdetails
#            (name "STAR WARS Zero Company™", Bit Reactor / Electronic Arts).
#            installdir "Star Wars Zero Company", depot 2075801 (see header, 2026-08-24).
#   epic   — OMITTED, not guessed. The Epic sandbox exists
#            (de33353d9bed419a8b985a46a34d0956) but publishes ZERO builds and its only
#            asset is a 1116-byte placeholder with artifactId "bruno" — a pre-purchase
#            stub. "bruno" turns out to be the game's internal codename (= the UE project
#            folder, see header 2026-08-24), which makes it MORE plausible as the eventual
#            AppName but still unconfirmed: Vortex matches the manifest AppName of the
#            SHIPPING artifact, and no build is published. Re-check egdata (sandbox
#            assets → artifactId, platform Windows) once builds publish; do not add until
#            then.
#   xbox   — OMITTED. The game has no Microsoft Store PC listing at all: two separate
#            storeedgefd v9.0 searches ("Star Wars Zero Company", "Star Wars Zero")
#            returned only unrelated LEGO/Jedi titles. Nothing to resolve an Identity
#            Name from. If a Game Pass release appears, note that Xbox needs THREE
#            values, not one — stores.xbox (Identity Name), game.xboxLauncher
#            (appExecName) and a WinGDK-aware executable path. See recipe §2.
stores:
  steam: "2075800"

context:
  # Only Steam is declared, so arch has a single arm. Kept as a storeBranch (rather than a
  # bare `Win64`) so adding an `xbox: WinGDK` arm at release is a one-line change and every
  # ${arch} path below follows automatically. Engine/Binaries stays Win64 even on Xbox.
  arch:
    storeBranch:
      default: Win64

  # The UE project folder — `Bruno`, Bit Reactor's internal codename, observed in the
  # Steam appinfo branch launch paths 2026-08-24 (see header). Every path below derives
  # from this. Observed-from-launch-config, not yet observed-on-disk: spot-check a real
  # install at release (header step 1) — if it is wrong, EVERY modType destination is
  # wrong and the build/tests stay green.
  gamePath: ${installPath}/Bruno

  pakModsPath:   ${gamePath}/Content/Paks/~mods
  logicModsPath: ${gamePath}/Content/Paks/LogicMods
  paksPath:      ${gamePath}/Content/Paks
  contentPath:   ${gamePath}/Content

  # UE4SS / ReShade / loose DLL plugins all live next to the shipping exe.
  binariesPath:  ${gamePath}/Binaries/${arch}
  ue4ssRootPath: ${gamePath}/Binaries/${arch}/ue4ss
  ue4ssModsPath: ${gamePath}/Binaries/${arch}/ue4ss/Mods

  # UE reads user config from %LOCALAPPDATA%/<Project>/Saved/Config/<TargetPlatform>, not
  # the install dir. The <Project> segment is the UE project name — `Bruno`, per the
  # launch-path observation above (UE derives this dir from FApp::GetProjectName). The
  # <TargetPlatform> LEAF is still a guess: it VARIES per game and build — `Windows` (UE5
  # unified), `WindowsClient` (client-only), `WindowsNoEditor` (UE4). Assuming
  # `WindowsClient` for Halo was wrong — it ships `Windows`. PCGamingWiki still lists no
  # Windows config path for this game (re-checked 2026-08-24), so there is nothing to
  # check against. Verify on a real install before release (header step 2).
  configPath: ${appDataLocal}/Bruno/Saved/Config/Windows   # UNVERIFIED leaf

modTypes:
  # Rule 6 (CLAUDE.md): once this game is PUBLISHED, these ids are permanent. Vortex stores
  # the id against every installed mod, so renaming one orphans users' mods and nothing in
  # the build, tests or corpus catches it. Rename freely BEFORE first release, never after.
  - { id: swzc-pak,            name: "Paks (~mods)",               path: "${pakModsPath}" }
  # Deploys under Content/Paks; the LogicMods/ subfolder rides along in each
  # file's stripped relative path (so placeAt == this path; see GDL114).
  - { id: swzc-logicmods,      name: "LogicMods (Blueprint paks)", path: "${paksPath}" }
  - { id: swzc-ue4ss,          name: "UE4SS (Lua mods)",           path: "${ue4ssModsPath}" }
  - { id: swzc-ue4ss-injector, name: "UE4SS (loader)",             path: "${binariesPath}" }
  - { id: swzc-binaries,       name: "Binaries (ReShade / DLL plugins)", path: "${binariesPath}" }
  - { id: swzc-root,           name: "Root (game folder)",         path: "${installPath}" }
  - { id: swzc-contentfolder,  name: "Content folder",             path: "${gamePath}" }
  # Deploys under Content/; the Paks/ subfolder rides along in each file's
  # stripped relative path (so placeAt == this path; see GDL114).
  - { id: swzc-pakalt,         name: "Paks (no ~mods)",            path: "${contentPath}" }
  - { id: swzc-config,         name: "Config (Engine.ini tweaks)", path: "${configPath}" }

installers:
  # --- Priority 15: UE4SS loader (dwmapi/xinput proxy or UE4SS-settings.ini) → Binaries ---
  # The `unless` is load-bearing, not defensive. This rule's `take: parent` resolves the
  # install root to <Project>/Binaries/<arch>, and stripPath drops every file outside that
  # subtree (gdl/src/runtime/installer-engine.ts:101-151). An archive laid out from the
  # install root that ships the loader AND other payload (a pak under Content/Paks/, say)
  # would silently lose everything outside Binaries/. Declining a game-relative archive here
  # hands it to `root` (16), which deploys the tree intact. This is not hypothetical: it hit
  # halocampaignevolved mod 68 (Ultra_Plus), which lost a three-file pak triplet that way.
  # Guarded here before it can bite.
  - id: ue4ss-injector
    priority: 15
    when: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "Bruno/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: parent
    placeAt: "${binariesPath}"
    modType: swzc-ue4ss-injector

  # --- Priority 16: Root (game-relative archives laid out from the install root) ---
  # AFTER the UE4SS loader (so injector packages keep their handling) but BEFORE
  # logicmods/ue4ss-lua/pak. When an archive is arranged from the install root (top-level
  # <Project>/ or Engine/), the whole tree deploys as-is, so a MIXED mod (lua under
  # Binaries/ + a pak under Content/Paks/) lands every file in place instead of ue4ss-lua
  # claiming it and dropping the pak.
  - id: root
    priority: 16
    when:
      any:
        - { hasFile: "Bruno/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: swzc-root

  # --- Priority 16.5: the same game-relative tree, wrapped in a folder ---
  # `root` (16) anchors its `when` at the archive root, so an author who wraps the tree in
  # a folder — usually the mod's own name — matches NOTHING and installs zero files,
  # silently. That affected six mods on halocampaignevolved (102, 126, 146, 147, 169, 202),
  # so it is included here from the start rather than waiting to be bitten.
  #
  # `copy: {stripCommonRoot: true}` is deliberate, not interchangeable with a directory
  # anchor. Two properties matter:
  #   - It keeps files OUTSIDE the game tree (a wrapped README), which a
  #     `**/<Project>/` anchor with `take: self` would silently drop.
  #   - A single anchor cannot span both <Project>/ and Engine/ — it keeps one and drops
  #     the other — whereas the whole-archive copy keeps both.
  # It also self-guards multi-variant archives (sibling wrappers each holding a full tree):
  # with no single common root there is nothing to strip, so the variants deploy verbatim
  # as folders the game ignores. Inert and visible beats collapsing several variants onto
  # one set of destinations. The DSL cannot count sibling directories, so this is the only
  # available guard — and the right outcome regardless.
  - id: wrapped-root
    priority: 16.5
    when:
      all:
        - any:
            - { hasFile: "**/Bruno/**" }
            - { hasFile: "**/Engine/**" }
        - not: { hasFile: "Bruno/**" }
        - not: { hasFile: "Engine/**" }
    copy: { stripCommonRoot: true }
    modType: swzc-root

  # --- Priority 17: Content folder (project-relative trees: Content/, Config/, Binaries/) ---
  # Sibling of `root` for archives laid out from the project folder rather than the install
  # root. The whole tree deploys to ${gamePath}, so a bare Binaries/ tree correctly lands
  # under the project folder.
  - id: content-folder
    priority: 17
    when:
      any:
        - { hasFile: "Content/**" }
        - { hasFile: "Config/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${gamePath}"
    modType: swzc-contentfolder

  # --- Priority 18: ReShade preset (ReShade.ini, strip wrapper) → Binaries ---
  - id: reshade
    priority: 18
    when: { hasFile: "**/ReShade.ini" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/ReShade.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: swzc-binaries

  # --- Priority 19: Engine.ini config tweak → %LOCALAPPDATA% Saved/Config ---
  # A bare Engine.ini that UE reads from the USER config dir, not the install dir. This was
  # the single most common mod category on halocampaignevolved (5 of 38 mods), which is why
  # it is scaffolded in up front rather than added reactively — install-dir-shaped rules
  # copied from a pak-only template miss it entirely.
  # Authors ship both spellings, hence the case-varied brace match.
  # The `unless` arms exclude archives carrying real payload (paks / utoc / dlls / lua /
  # game-relative trees), so a mod bundling a config ALONGSIDE a pak keeps its own routing
  # instead of being reduced to a config drop. tests.cases asserts that guard directly.
  - id: config-ini
    priority: 19
    when: { hasFile: "**/{Engine.ini,engine.ini}" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "Bruno/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{Engine.ini,engine.ini}"
    take: parent
    placeAt: "${configPath}"
    modType: swzc-config

  # NOTE: an archive shaped `Config/Engine.ini` routes to content-folder (17, lower number
  # wins) and lands in <Project>/Config/, NOT the user config dir. That is correct for a
  # project-relative archive. Revisit only if a real mod ships that shape.

  # --- Priority 20: LogicMods (Blueprint paks under LogicMods/) → Content/Paks ---
  - id: logicmods
    priority: 20
    when: { hasFile: "**/LogicMods/**" }
    anchor: "**/LogicMods/"
    take: self
    placeAt: "${paksPath}"
    modType: swzc-logicmods

  # --- Priority 22: UE4SS Lua (Scripts/*.lua present) → ue4ss/Mods ---
  - id: ue4ss-lua
    priority: 22
    when: { hasFile: "**/Scripts/*.lua" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/Scripts/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: swzc-ue4ss

  # --- Priority 23: UE4SS Lua (enabled.txt only) → ue4ss/Mods ---
  - id: ue4ss-lua-enabled
    priority: 23
    when: { hasFile: "**/enabled.txt" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/enabled.txt"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: swzc-ue4ss

  # --- Priority 24: UE4SS Lua (bare .lua, no Scripts/ dir) → ue4ss/Mods ---
  - id: ue4ss-lua-bare
    priority: 24
    when: { hasFile: "**/*.lua" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: swzc-ue4ss

  # --- Priority 27: Loose native DLL plugin (e.g. winmm/dll-injector mods) → Binaries ---
  - id: native-dll
    priority: 27
    when: { hasFile: "**/*.dll" }
    unless:
      any:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/ue4ss/**" }
        - { hasFile: "**/ReShade.ini" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/Bruno/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.dll"
    take: parent
    placeAt: "${binariesPath}"
    modType: swzc-binaries

  # --- Priority 28: A Paks/ folder bundled in the archive (not ~mods) → Content/Paks ---
  - id: pak-alt
    priority: 28
    when:
      all:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Paks/**" }
    unless:
      any:
        - { hasFile: "**/~mods/**" }
        - { hasFile: "**/LogicMods/**" }
        - { hasFile: "**/Bruno/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/Paks/"
    take: self
    placeAt: "${contentPath}"
    modType: swzc-pakalt

  # --- Priority 29: IO Store mod (utoc/ucas without a .pak) → ~mods ---
  # UE5 defaults to IoStore, so utoc/ucas-only mods are expected here. A mod carrying BOTH
  # a .pak and a .utoc routes to `pak` (30) instead — this rule's `unless: **/*.pak`
  # excludes it — which keeps the triplet together. tests.cases pins that ordering.
  - id: pak-iostore
    priority: 29
    when: { hasFile: "**/*.utoc" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Bruno/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.utoc"
    take: parent
    placeAt: "${pakModsPath}"
    modType: swzc-pak

  # --- Priority 30: Default pak mod → flatten into ~mods ---
  - id: pak
    priority: 30
    when: { hasFile: "**/*.pak" }
    unless:
      any:
        - { hasFile: "**/Bruno/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.pak"
    take: parent
    placeAt: "${pakModsPath}"
    modType: swzc-pak

setup:
  ensureDirs:
    - ${pakModsPath}
    # The user-config dir must be created too: UE only writes it on first launch, and the
    # game does not ship Engine.ini at all (verified on Meteorite and Subnautica2 — both
    # have only GameUserSettings.ini there). Deploying a config mod before first launch
    # would otherwise hit a missing target: the "Deployment target unknown" failure fixed
    # for games/paralives in 1.3.1. Any deploy target outside the install dir needs this.
    - ${configPath}
    # UE4SS Lua mods (ue4ss-lua, ue4ss-lua-enabled, ue4ss-lua-bare → swzc-ue4ss) deploy
    # here, but nothing creates it: the game ships no Binaries/<arch>/ue4ss, and UE4SS only
    # creates Mods/ once its loader is installed. This does NOT make UE4SS work — the
    # loader is still required — it only stops the deploy failing.
    - ${ue4ssModsPath}

toolbarActions:
  - id: open-ue4ss-settings
    title: Open UE4SS Settings INI
    priority: 200
    target: { openFile: "${ue4ssRootPath}/UE4SS-settings.ini" }

  - id: open-nexus-page
    title: Open Nexus Page
    priority: 201
    target: { openUrl: "https://www.nexusmods.com/starwarszerocompany" }

nexus:
  modId: 2174            # nexusmods.com/site/mods/2174 (the Vortex extension page)
  # Confirmed present via v1 (/games/site/mods/2174.json → mod_id 2174, game_id 2295).
  # The page is still status "not_published" / available: false, which is expected for an
  # unreleased extension — it does not block building or packaging, only publishing.
  fileGroupId: 7829331
  # fileGroupId is NOT verifiable through the v1 API until a file is uploaded
  # (/files.json currently returns zero files and no group ids), so this value comes from
  # the maintainer reading it off the Nexus upload page — the route recipe §4 prescribes.
  # Re-check it against the upload page if publishing ever 404s on the file group.
  #
  # NO COLON in displayName. The Nexus mod-file-version API validates against
  # ^[a-zA-Z0-9 _'().-]+$ and 422s on a colon, so "Star Wars: Zero Company …" fails to
  # publish even though the game's official name has one. game.name above drops the colon
  # for the same reason.
  displayName: "Star Wars Zero Company Support for Vortex"

# ---------------------------------------------------------------------------------------
# CORPUS STATE: NO COVERAGE — and it cannot be obtained yet.
# As of 2026-08-18 the Nexus page reports mods: 0, file_count: 0, downloads: 0,
# approved_date: 0 (api.nexusmods.com/v1/games/starwarszerocompany.json). The game is
# unreleased, so there is nothing published to route. RE-CHECKED 2026-08-24 (Steam
# preload day): v1 still reports mods: 0 / approved_date: 0, and `test-corpus -- --fetch`
# still exits 1 with "Unknown Nexus game domain" — both blockers unchanged.
#
# `tests.corpus: nexus` is declared below so the loop is wired and ready, but running
# `pnpm nx run starwarszerocompany:test-corpus -- --fetch` today fails outright with
#   Unknown Nexus game domain: starwarszerocompany
# The corpus resolves domains via the v2 GraphQL API, which does not know this domain yet
# even though the v1 REST API returns a record for it (id 9861) — consistent with a game
# page that exists but has never been approved (approved_date: 0). So coverage is blocked
# for TWO independent reasons: the domain is unresolvable, and there are no mods to route.
#
# The two invocations fail DIFFERENTLY, and the difference matters (both verified here
# 2026-08-18):
#   * `test-corpus -- --fetch`  → EXIT 1, Nx reports the task as failed. The unknown-domain
#     error is thrown in gdl's corpus fetch and propagates, so this one is loud.
#   * `test-corpus` (bare, empty cache) → EXIT 0, prints "no archives in tests/cache/ —
#     nothing to do". THIS is the silent vacuous pass described in docs/corpus-manifests.md:
#     zero coverage that looks exactly like success.
# So read the output, never the exit code. Once the game is live, do not treat a green
# corpus run as verification until the `T total` in the summary reconciles against a
# non-zero `mods` count from the v1 API.
#
# Every tests.case below is therefore ILLUSTRATIVE — derived from real archive shapes seen
# on other UE5 games in this repo (halocampaignevolved, outward2, solarpunk), not from real
# Star Wars: Zero Company mods, which do not exist. They verify that the RULE WIRING behaves
# (priority ordering, unless-guards, path flattening) — they do NOT verify that the
# destination paths are correct for this game, because the project folder is unverified.
# Replace them with real shapes once the corpus has something to fetch.
# ---------------------------------------------------------------------------------------

# Corpus validators: assertions checked against real Nexus archives via
# `gdl test:corpus --fetch` (needs NEXUS_API_KEY). Inert until mods exist, but they encode
# the intended routing now so a future rule change cannot regress it unnoticed.
validators:
  - id: injector-validator
    name: UE4SS loader archives (dwmapi/xinput/UE4SS-settings.ini) match ue4ss-injector
    # Game-relative loader bundles are claimed by `root` by design (installer 15), so they
    # are excluded here — pak-payload-placement covers their payload instead.
    when:
      all:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "Bruno/**" }
        - not: { hasFile: "Engine/**" }
    assert: { matched: ue4ss-injector }

  - id: reshade-validator
    name: ReShade presets (ReShade.ini, no loader) match reshade
    when:
      all:
        - { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    assert: { matched: reshade }

  - id: logicmods-validator
    name: LogicMods paks (not loader / game- or project-relative trees) match logicmods
    # The not-arms exclude shapes that HIGHER-priority installers legitimately claim ahead
    # of logicmods (20): the UE4SS loader (15), game-relative trees via root (16), wrapped
    # trees via wrapped-root (16.5) — `**/Bruno/**` covers the root-level form too — and
    # project-relative trees via content-folder (17). Without them this validator would
    # false-fail on a correctly routed `Bruno/Content/Paks/LogicMods/…` archive.
    # (halocampaignevolved's equivalent validator has no such arms and got away with it
    # only because no such shape existed in its corpus.)
    when:
      all:
        - { hasFile: "**/LogicMods/**/*.pak" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/Bruno/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "Content/**" }
        - not: { hasFile: "Config/**" }
        - not: { hasFile: "Binaries/**" }
    assert: { matched: logicmods }

  - id: config-validator
    name: Bare Engine.ini archives (no payload) match config-ini
    when:
      all:
        - { hasFile: "**/{Engine.ini,engine.ini}" }
        - not: { hasFile: "**/*.pak" }
        - not: { hasFile: "**/*.utoc" }
        - not: { hasFile: "**/*.dll" }
        - not: { hasFile: "**/*.lua" }
        - not: { hasFile: "Bruno/**" }
        - not: { hasFile: "Engine/**" }
    assert: { matched: config-ini }

  # Placement guard: regardless of which pak installer wins, IoStore pak payloads must land
  # under Content/Paks and never loose at the game-folder root (a .ucas at the root is
  # silently ignored by UE and is a common mis-route). This also catches a payload class
  # vanishing from the plan entirely, which is how the halo mod-68 pak-dropping bug
  # surfaced.
  - id: pak-payload-placement
    name: .pak/.ucas/.utoc install under Content/Paks, never at the game root
    when: { hasFile: "**/*.{pak,ucas,utoc}" }
    assert:
      placement:
        - files: "**/*.{pak,ucas,utoc}"
          mustMatch: "**/Content/Paks/**"
          mustNotMatch: "${installPath}/*"

tests:
  corpus: nexus
  # NOTE: the `Bruno/…` strings in the archive fixtures below use the real project folder
  # (observed 2026-08-24, see header), but the fixtures themselves are still synthetic
  # test INPUTS — illustrative archive shapes borrowed from other UE5 games, not observed
  # Star Wars Zero Company mods (none exist yet; see the corpus-state note).
  cases:
    # --- UE4SS loader ---
    - name: "ue4ss-injector: dwmapi.dll + ue4ss tree dropped into Binaries"
      archive:
        - dwmapi.dll
        - tbb12.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/keep_me.txt
      expect:
        matched: ue4ss-injector
        modType: swzc-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/tbb12.dll
          - ${binariesPath}/ue4ss/UE4SS-settings.ini
          - ${binariesPath}/ue4ss/Mods/keep_me.txt

    # GUARD CASE — PINS inherited template behavior (halocampaignevolved has the same
    # guard shape): a FLAT loader archive carrying a stray pak is claimed whole by
    # ue4ss-injector (15), whose `unless` declines only game-relative trees — so the pak
    # lands, inert, in Binaries/ rather than Content/Paks. No flat loader+pak mod has been
    # seen in any corpus; the pak-payload-placement validator will flag one loudly if it
    # ever appears. If that happens, decide the routing deliberately and update this case —
    # note the naive fix (an `unless: **/*.pak` arm here) would instead hand the LOADER to
    # `pak` (30) and misroute it into ~mods, which is no better.
    - name: "ue4ss-injector: flat loader archive with a stray pak is taken whole (pinned)"
      archive:
        - dwmapi.dll
        - UE4SS-settings.ini
        - Stray_P.pak
      expect:
        matched: ue4ss-injector
        modType: swzc-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/UE4SS-settings.ini
          - ${binariesPath}/Stray_P.pak

    # --- ReShade preset ---
    - name: "reshade: preset folder stripped into Binaries"
      archive:
        - WarmSun/ReShade.ini
        - WarmSun/WarmSun.ini
        - WarmSun/reshade-shaders/Shaders/Clarity.fx
      expect:
        matched: reshade
        modType: swzc-binaries
        plan:
          - ${binariesPath}/ReShade.ini
          - ${binariesPath}/WarmSun.ini
          - ${binariesPath}/reshade-shaders/Shaders/Clarity.fx

    # --- Loose native DLL plugin ---
    - name: "native-dll: bare dll placed in Binaries"
      archive:
        - SomePlugin.dll
      expect:
        matched: native-dll
        modType: swzc-binaries
        plan:
          - ${binariesPath}/SomePlugin.dll

    # --- UE4SS Lua ---
    - name: "ue4ss-lua: lua mod with Scripts folder"
      archive:
        - MyMod/Scripts/main.lua
        - MyMod/enabled.txt
      expect:
        matched: ue4ss-lua
        modType: swzc-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/enabled.txt

    # --- LogicMods ---
    - name: "logicmods: paks under LogicMods/ folder"
      archive:
        - Pack/LogicMods/BPFolder/X.pak
      expect:
        matched: logicmods
        modType: swzc-logicmods
        plan:
          - ${paksPath}/LogicMods/BPFolder/X.pak

    # --- Config tweaks (the category a pak-only template misses entirely) ---
    - name: "config-ini: bare Engine.ini lands in the user config dir, not the install dir"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: swzc-config
        plan:
          - ${configPath}/Engine.ini

    - name: "config-ini: lowercase engine.ini in a named wrapper folder is stripped"
      archive:
        - Smooth Framerate/engine.ini
        - Smooth Framerate/README.txt
      expect:
        matched: config-ini
        modType: swzc-config
        plan:
          - ${configPath}/engine.ini
          - ${configPath}/README.txt

    # GUARD CASE — asserts the config-ini `unless: **/*.pak` arm. Without that arm this
    # archive would be reduced to a config drop and the pak silently lost. Removing the
    # guard must fail this test.
    - name: "config-ini guard: Engine.ini bundled WITH a pak keeps its pak routing"
      archive:
        - MyMod/Engine.ini
        - MyMod/MyMod_P.pak
      expect:
        matched: pak
        modType: swzc-pak
        plan:
          - ${pakModsPath}/MyMod_P.pak
          - ${pakModsPath}/Engine.ini

    # --- Pak mods ---
    - name: "pak: single pak file flattened to ~mods"
      archive:
        - SomeMod/Cool.pak
      expect:
        matched: pak
        modType: swzc-pak
        plan:
          - ${pakModsPath}/Cool.pak

    # A .pak alongside .utoc/.ucas must route to `pak` (30), NOT `pak-iostore` (29), whose
    # `unless: **/*.pak` excludes it — keeping the triplet together in one destination.
    - name: "pak: pak wins over pak-iostore when both present"
      archive:
        - Better Stacks/0_BetterStacks_P.pak
        - Better Stacks/0_BetterStacks_P.ucas
        - Better Stacks/0_BetterStacks_P.utoc
      expect:
        matched: pak
        modType: swzc-pak
        plan:
          - ${pakModsPath}/0_BetterStacks_P.pak
          - ${pakModsPath}/0_BetterStacks_P.ucas
          - ${pakModsPath}/0_BetterStacks_P.utoc

    - name: "pak-iostore: utoc+ucas without a pak"
      archive:
        - SomeMod/x_P.utoc
        - SomeMod/x_P.ucas
      expect:
        matched: pak-iostore
        modType: swzc-pak
        plan:
          - ${pakModsPath}/x_P.utoc
          - ${pakModsPath}/x_P.ucas

    - name: "pak-alt: bundled Paks/ folder → Content/Paks"
      archive:
        - mod/Paks/sub/x.pak
        - mod/Paks/sub/x.ucas
        - mod/Paks/sub/x.utoc
      expect:
        matched: pak-alt
        modType: swzc-pakalt
        plan:
          - ${contentPath}/Paks/sub/x.pak
          - ${contentPath}/Paks/sub/x.ucas
          - ${contentPath}/Paks/sub/x.utoc

    - name: "content-folder: Content/ at archive root"
      archive:
        - Content/Foo.uasset
        - Content/Bar.uexp
      expect:
        matched: content-folder
        modType: swzc-contentfolder
        plan:
          - ${gamePath}/Content/Foo.uasset
          - ${gamePath}/Content/Bar.uexp

    # --- Game-relative trees ---
    - name: "root: project folder + Engine segments deploy intact"
      archive:
        - Bruno/Content/Paks/foo.pak
        - Engine/Content/bar.uasset
      expect:
        matched: root
        modType: swzc-root
        plan:
          - ${installPath}/Bruno/Content/Paks/foo.pak
          - ${installPath}/Engine/Content/bar.uasset

    # GUARD CASE — asserts the ue4ss-injector `unless` arm. A game-relative archive shipping
    # BOTH the loader and a pak must go to `root` (16), not ue4ss-injector (15), or the pak
    # payload outside Binaries/ is silently dropped (the real halo mod-68 failure).
    - name: "injector guard: game-relative loader + pak deploys intact via root"
      archive:
        - Bruno/Binaries/Win64/dwmapi.dll
        - Bruno/Binaries/Win64/ue4ss/UE4SS-settings.ini
        - Bruno/Content/Paks/~mods/Payload_P.pak
      expect:
        matched: root
        modType: swzc-root
        plan:
          - ${installPath}/Bruno/Binaries/Win64/dwmapi.dll
          - ${installPath}/Bruno/Binaries/Win64/ue4ss/UE4SS-settings.ini
          - ${installPath}/Bruno/Content/Paks/~mods/Payload_P.pak

    # GUARD CASE — asserts wrapped-root (16.5). Without it this archive matches NOTHING and
    # installs zero files, silently (six real mods hit this on halocampaignevolved).
    # NOTE the plan paths here are modType-relative (swzc-root already resolves to
    # ${installPath}), unlike the `root` cases above which are written absolute. That is a
    # property of `copy: {stripCommonRoot: true}`, which emits relative destinations —
    # matching games/halocampaignevolved. Don't "fix" these into ${installPath}/… form.
    - name: "wrapped-root: game tree wrapped in a mod-name folder has the wrapper stripped"
      archive:
        - Cool Mod v2/Bruno/Content/Paks/~mods/Cool_P.pak
        - Cool Mod v2/README.txt
      expect:
        matched: wrapped-root
        modType: swzc-root
        plan:
          - README.txt
          - Bruno/Content/Paks/~mods/Cool_P.pak

    # GUARD CASE — the converse of the above. A tree ALREADY at the archive root must stay
    # with `root` (16); wrapped-root must decline it, or stripCommonRoot would eat the
    # project-folder segment itself and deploy the tree one level too high.
    - name: "root still wins for an unwrapped tree (wrapped-root declines)"
      archive:
        - Bruno/Content/Paks/~mods/Cool_P.pak
        - README.txt
      expect:
        matched: root
        modType: swzc-root
        plan:
          - ${installPath}/Bruno/Content/Paks/~mods/Cool_P.pak
          - ${installPath}/README.txt
