gdl: 1
version: 1.0.1   # extension version: drives info.json, the release tag, and the zip name

# The Blood of Dawnwalker (Rebel Wolves / Bandai Namco): dark-fantasy RPG, Unreal Engine 5.
# Steam app 3751260; Nexus domain thebloodofdawnwalker (v1 game id 9719).
#
# Layout verified on a real Steam install 2026-09-02, buildid 25014996:
#   * Install root holds Dawnwalker/ and Engine/. UE project folder is Dawnwalker.
#   * Dawnwalker/Binaries/Win64/Dawnwalker.exe, 176,484,216 bytes, OriginalFilename
#     Dawnwalker-Win64-Shipping.exe. Steam's default-branch launch entry points here.
#   * IoStore: Content/Paks holds Dawnwalker-Windows.{pak,ucas,utoc} plus global.utoc and
#     global.ucas. Hence supportsSymlinks: false below.
#   * Dawnwalker/ holds only Binaries/ and Content/.
#   * The exe reports version dw1-pc-256181-shipping-patch2-all-CL-256181, which Vortex
#     surfaces verbatim. Add a discovery.version hook if version ordering is ever needed.
#   * User config leaf is Windows: %LOCALAPPDATA%/Dawnwalker/Saved/Config/Windows, holding
#     GameUserSettings.ini and GameUserFramegen.ini after first launch. No Engine.ini, so
#     setup.ensureDirs has to create the directory.
#
# Supports: pak mods (Content/Paks/~mods), LogicMods, UE4SS (loader + Lua mods), ReShade
# presets, loose native DLL plugins, Engine.ini config tweaks, whole-folder root mods.
# Ladder inherited from games/starwarszerocompany, plus content-relative added for this
# game's own archives. Routes 32 of 33 published mods; see the CORPUS STATE note.
# ===============================================================================

game:
  id: thebloodofdawnwalker
  name: The Blood of Dawnwalker
  # Steam's default-branch launch target. Scalar because only Steam is declared.
  executable: Dawnwalker/Binaries/Win64/Dawnwalker.exe

  # A discovery fingerprint, not the launch target: Vortex stats every entry and all must
  # exist, with no glob expansion.
  #
  # Arch-pinned to Binaries/Win64, so it would fail discovery on Game Pass (WinGDK). Fine
  # while xbox is omitted. When xbox is added, swap this for
  # Dawnwalker/Content/Paks/global.utoc, which is present (374 bytes) and carries no
  # platform tag. Adding the WinGDK path as a second entry breaks both stores instead.
  requiredFiles: [Dawnwalker/Binaries/Win64/Dawnwalker.exe]

  logo: gameart.webp
  author: Nexus Mods
  nexusDomain: thebloodofdawnwalker
  details:
    # Required: this game uses IoStore (verified, see header) and symlinked .utoc/.ucas
    # crash the UE5 Zen loader at startup with EXCEPTION_ACCESS_VIOLATION in
    # FZenPackageHeader::MakeView. Proven on starwarszerocompany 2026-08-30 by A/B.
    # Write `false` or omit the key; Vortex only tests `=== false`, so `true` is a no-op
    # that reads like a verified claim. See docs/deployment-methods.md.
    supportsSymlinks: false
    gameProjectFolder: Dawnwalker
    ignoreConflicts: [UE4SS-settings.ini, enabled.txt]

# Steam is the only store with a confirmed id.
#   steam:   3751260, confirmed via Steam appinfo (name "The Blood of Dawnwalker", type
#            Game, Rebel Wolves / Bandai Namco, installdir "The Blood of Dawnwalker",
#            depots 3751261-3751263 plus the shared redist 228989).
#   epic:    omitted. egdata autocomplete for "Dawnwalker" returns zero elements
#            (2026-09-01), so there is no artifact AppName to match. Re-check if an Epic
#            release is announced.
#   xbox:    omitted for want of an id. displaycatalog product 9NRKJPL74R13 allows
#            Windows.Desktop, so a PC release is planned, but every SKU is IsBundle:true
#            with empty Packages, and storeedgefd gives PackageFamilyNames [""], so no
#            Identity Name exists yet.
#            When it publishes, Xbox needs three values: stores.xbox (Identity Name, for
#            discovery), game.xboxLauncher appExecName (launching; without it Vortex
#            bare-spawns the exe and reports the failed launch as a success), and a
#            WinGDK-aware game.executable (process monitoring and version). Plus the
#            requiredFiles swap noted above. Recipe §2.
stores:
  steam: "3751260"

context:
  # Only Steam is declared, so arch has a single arm. Kept as a storeBranch (rather than a
  # bare `Win64`) so adding an `xbox: WinGDK` arm at release is a one-line change and every
  # ${arch} path below follows automatically. Engine/Binaries stays Win64 even on Xbox.
  arch:
    storeBranch:
      default: Win64

  # Every path below derives from this, so a wrong value breaks every modType destination
  # silently. Confirmed on a real install, see the header.
  gamePath: ${installPath}/Dawnwalker

  pakModsPath:   ${gamePath}/Content/Paks/~mods
  logicModsPath: ${gamePath}/Content/Paks/LogicMods
  paksPath:      ${gamePath}/Content/Paks
  contentPath:   ${gamePath}/Content

  # UE4SS / ReShade / loose DLL plugins all live next to the shipping exe.
  binariesPath:  ${gamePath}/Binaries/${arch}
  ue4ssRootPath: ${gamePath}/Binaries/${arch}/ue4ss
  ue4ssModsPath: ${gamePath}/Binaries/${arch}/ue4ss/Mods

  # UE reads user config from %LOCALAPPDATA%/<Project>/Saved/Config/<TargetPlatform>, not
  # the install dir. Leaf confirmed as Windows on a real install 2026-09-02. It varies per
  # game (WindowsClient, WindowsNoEditor), so never copy this to another game unchecked.
  configPath: ${appDataLocal}/Dawnwalker/Saved/Config/Windows

modTypes:
  # Rule 6 (CLAUDE.md): once this game is PUBLISHED, these ids are permanent. Vortex stores
  # the id against every installed mod, so renaming one orphans users' mods and nothing in
  # the build, tests or corpus catches it. Rename freely BEFORE first release, never after.
  - { id: dawnwalker-pak,            name: "Paks (~mods)",               path: "${pakModsPath}" }
  # Deploys under Content/Paks; the LogicMods/ subfolder rides along in each
  # file's stripped relative path (so placeAt == this path; see GDL114).
  - { id: dawnwalker-logicmods,      name: "LogicMods (Blueprint paks)", path: "${paksPath}" }
  - { id: dawnwalker-ue4ss,          name: "UE4SS (Lua mods)",           path: "${ue4ssModsPath}" }
  - { id: dawnwalker-ue4ss-injector, name: "UE4SS (loader)",             path: "${binariesPath}" }
  - { id: dawnwalker-binaries,       name: "Binaries (ReShade / DLL plugins)", path: "${binariesPath}" }
  - { id: dawnwalker-root,           name: "Root (game folder)",         path: "${installPath}" }
  - { id: dawnwalker-contentfolder,  name: "Content folder",             path: "${gamePath}" }
  # Deploys under Content/; the Paks/ subfolder rides along in each file's
  # stripped relative path (so placeAt == this path; see GDL114).
  - { id: dawnwalker-pakalt,         name: "Paks (no ~mods)",            path: "${contentPath}" }
  # deploymentEssential: false keeps hardlink available. This is the only modType off the
  # game drive, and Vortex drops any method that cannot handle every registered modType, so
  # for a user whose staging folder is on another volume this one path would otherwise
  # remove hardlink and move. With supportsSymlinks: false that leaves no method at all
  # (reproduced on starwarszerocompany 1.0.2). Config mods still fail cross-volume with
  # EXDEV, which Vortex reports as "files were locked by external applications", so say so
  # in the release notes. See docs/deployment-methods.md.
  - { id: dawnwalker-config,         name: "Config (Engine.ini tweaks)", path: "${configPath}",
      deploymentEssential: false }

installers:
  # --- Priority 15: UE4SS loader (dwmapi/xinput proxy or UE4SS-settings.ini) → Binaries ---
  # The `unless` is load-bearing, not defensive. This rule's `take: parent` resolves the
  # install root to <Project>/Binaries/<arch>, and stripPath drops every file outside that
  # subtree. An archive laid out from the install root that ships the loader AND other
  # payload (a pak under Content/Paks/, say) would silently lose everything outside
  # Binaries/. Declining a game-relative archive here hands it to `root` (16), which deploys
  # the tree intact. This is not hypothetical: it hit halocampaignevolved mod 68
  # (Ultra_Plus), which lost a three-file pak triplet exactly that way.
  - id: ue4ss-injector
    priority: 15
    when: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    unless:
      any:
        - { hasFile: "Dawnwalker/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}"
    take: parent
    placeAt: "${binariesPath}"
    modType: dawnwalker-ue4ss-injector

  # --- Priority 16: Root (game-relative archives laid out from the install root) ---
  # AFTER the UE4SS loader (so injector packages keep their handling) but BEFORE
  # logicmods/ue4ss-lua/pak. When an archive is arranged from the install root (top-level
  # Dawnwalker/ or Engine/), the whole tree deploys as-is, so a MIXED mod (lua under
  # Binaries/ + a pak under Content/Paks/) lands every file in place instead of ue4ss-lua
  # claiming it and dropping the pak.
  - id: root
    priority: 16
    when:
      any:
        - { hasFile: "Dawnwalker/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${installPath}"
    modType: dawnwalker-root

  # --- Priority 16.5: the same game-relative tree, wrapped in a folder ---
  # `root` (16) anchors its `when` at the archive root, so an author who wraps the tree in a
  # folder (usually the mod's own name) matches NOTHING and installs zero files, silently.
  # That affected six mods on halocampaignevolved (102, 126, 146, 147, 169, 202), so it is
  # included from the start rather than waiting to be bitten.
  #
  # `copy: {stripCommonRoot: true}` is deliberate, not interchangeable with a directory
  # anchor. Two properties matter:
  #   - It keeps files OUTSIDE the game tree (a wrapped README), which a `**/Dawnwalker/`
  #     anchor with `take: self` would silently drop.
  #   - A single anchor cannot span both Dawnwalker/ and Engine/: it keeps one and drops
  #     the other, whereas the whole-archive copy keeps both.
  # It also self-guards multi-variant archives (sibling wrappers each holding a full tree):
  # with no single common root there is nothing to strip, so the variants deploy verbatim as
  # folders the game ignores. Inert and visible beats collapsing several variants onto one
  # set of destinations. The DSL cannot count sibling directories, so this is the only
  # available guard, and the right outcome regardless.
  - id: wrapped-root
    priority: 16.5
    when:
      all:
        - any:
            - { hasFile: "**/Dawnwalker/**" }
            - { hasFile: "**/Engine/**" }
        - not: { hasFile: "Dawnwalker/**" }
        - not: { hasFile: "Engine/**" }
    copy: { stripCommonRoot: true }
    modType: dawnwalker-root

  # --- Priority 17: Content folder (project-relative trees: Content/, Config/, Binaries/) ---
  # Sibling of `root` for archives laid out from the project folder rather than the install
  # root. The whole tree deploys to ${gamePath}, so a bare Binaries/ tree correctly lands
  # under the project folder.
  - id: content-folder
    priority: 17
    when:
      any:
        - { hasFile: "Content/**" }
        - { hasFile: "Config/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${gamePath}"
    modType: dawnwalker-contentfolder

  # --- Priority 18: ReShade preset (ReShade.ini, strip wrapper) → Binaries ---
  - id: reshade
    priority: 18
    when: { hasFile: "**/ReShade.ini" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/ReShade.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: dawnwalker-binaries

  # --- Priority 19: Engine.ini config tweak → %LOCALAPPDATA% Saved/Config ---
  # A bare Engine.ini that UE reads from the USER config dir, not the install dir. This was
  # the single most common mod category on halocampaignevolved (5 of 38 mods) and four of
  # the first thirty on starwarszerocompany, which is why it is scaffolded in up front:
  # install-dir-shaped rules copied from a pak-only template miss it entirely.
  # Authors ship both spellings, hence the case-varied brace match.
  # The `unless` arms exclude archives carrying real payload (paks / utoc / dlls / lua /
  # game-relative trees), so a mod bundling a config ALONGSIDE a pak keeps its own routing
  # instead of being reduced to a config drop. tests.cases asserts that guard directly.
  # The brace list covers the UE user-config files an author might ship, in both spellings.
  # It is NOT every .ini: a bare unknown .ini is a ReShade preset far more often than a
  # config tweak, and is handled by reshade-preset (19.5). GameUserSettings.ini is included
  # because the game writes it there, so a mod shipping a preconfigured one belongs in the
  # same place.
  - id: config-ini
    priority: 19
    when:
      hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,GameUserFramegen.ini,gameuserframegen.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}"
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "Dawnwalker/**" }
        - { hasFile: "Engine/**" }
    anchor: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,GameUserFramegen.ini,gameuserframegen.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}"
    take: parent
    placeAt: "${configPath}"
    modType: dawnwalker-config

  # NOTE: an archive shaped `Config/Engine.ini` routes to content-folder (17, lower number
  # wins) and lands in Dawnwalker/Config/, NOT the user config dir. That is correct for a
  # project-relative archive. Revisit only if a real mod ships that shape.

  # --- Priority 19.5: bare ReShade PRESET .ini (not ReShade.ini itself) → Binaries ---
  # `reshade` (18) only matches the literal ReShade.ini. Authors routinely publish just the
  # preset, named after the preset itself: starwarszerocompany mod 12 ships a lone
  # `ZeroCompanyReshadeByScottyus1.ini`, which matched nothing before that game added this
  # rule. ReShade reads presets from next to the injector dll, so Binaries is the right
  # destination.
  #
  # AFTER config-ini (19) deliberately: an Engine.ini must keep its user-config routing, and
  # this rule would otherwise steal it. On starwarszerocompany that ordering bug shipped in
  # 1.0.0 and mis-routed a real mod. The two brace lists must keep agreeing.
  # The `unless` arms drop archives carrying real payload (an .ini shipped alongside a
  # pak/dll/lua belongs with that payload) and game-relative trees, which `root` handles.
  - id: reshade-preset
    priority: 19.5
    when: { hasFile: "**/*.ini" }
    unless:
      any:
        - { hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,GameUserFramegen.ini,gameuserframegen.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/*.utoc" }
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.lua" }
        - { hasFile: "**/Dawnwalker/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.ini"
    take: parent
    placeAt: "${binariesPath}"
    modType: dawnwalker-binaries

  # --- Priority 20: LogicMods (Blueprint paks under LogicMods/) → Content/Paks ---
  - id: logicmods
    priority: 20
    when: { hasFile: "**/LogicMods/**" }
    anchor: "**/LogicMods/"
    take: self
    placeAt: "${paksPath}"
    modType: dawnwalker-logicmods

  # --- Priority 22: UE4SS Lua (Scripts/*.lua present) → ue4ss/Mods ---
  - id: ue4ss-lua
    priority: 22
    when: { hasFile: "**/Scripts/*.lua" }
    unless: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/Scripts/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: dawnwalker-ue4ss

  # --- Priority 23: UE4SS Lua (enabled.txt only) → ue4ss/Mods ---
  - id: ue4ss-lua-enabled
    priority: 23
    when: { hasFile: "**/enabled.txt" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/enabled.txt"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: dawnwalker-ue4ss

  # --- Priority 24: UE4SS Lua (bare .lua, no Scripts/ dir) → ue4ss/Mods ---
  - id: ue4ss-lua-bare
    priority: 24
    when: { hasFile: "**/*.lua" }
    unless:
      any:
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/enabled.txt" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    anchor: "**/*.lua"
    take: parent.parent
    placeAt: "${ue4ssModsPath}"
    modType: dawnwalker-ue4ss

  # --- Priority 27: Loose native DLL plugin (e.g. winmm/dll-injector mods) → Binaries ---
  # `.addon64` is a ReShade/RenoDX addon, which loads from beside the shipping exe just as a
  # proxy dll does. Real mods 51 and 52 ship one NEXT TO a .dll so the dll anchored them, but
  # mod 37 ships `renodx-ue-extended.addon64` alone and matched nothing at all.
  - id: native-dll
    priority: 27
    when:
      any:
        - { hasFile: "**/*.dll" }
        - { hasFile: "**/*.addon64" }
    unless:
      any:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - { hasFile: "**/ue4ss/**" }
        - { hasFile: "**/ReShade.ini" }
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Scripts/*.lua" }
        - { hasFile: "**/Dawnwalker/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/*.{dll,addon64}"
    take: parent
    placeAt: "${binariesPath}"
    modType: dawnwalker-binaries

  # --- Priority 27.5: Content-relative tree (Paks/, Movies/, Splash/ at the archive ROOT) ---
  # These archives are laid out from Content/ rather than from the project folder, so the
  # whole tree belongs at ${contentPath}. Anchoring on Paks/ the way pak-alt (28) does keeps
  # only the paks and SILENTLY DROPS the siblings: real mod 9 (Thai localisation) ships
  # Movies/intro_cgi_en.srt next to Paks/Dawnwalker-Windows_P.*, and under pak-alt its
  # subtitle file vanished while the install still reported success. Same failure class as
  # the halocampaignevolved mod-68 pak drop.
  # It also picks up bare Splash/Splash.bmp replacements (real mod 24), which matched nothing
  # at all before: UE reads the splash from <Project>/Content/Splash.
  # Anchored at the archive root, so a NESTED wrapper (mod/Paks/sub/x.pak) still falls
  # through to pak-alt, which is what that rule is for.
  - id: content-relative
    priority: 27.5
    when:
      any:
        - { hasFile: "Paks/**" }
        - { hasFile: "Movies/**" }
        - { hasFile: "Splash/**" }
    unless:
      any:
        - { hasFile: "Dawnwalker/**" }
        - { hasFile: "Engine/**" }
        - { hasFile: "Content/**" }
        - { hasFile: "Binaries/**" }
    anchor: "**/*"
    take: archive-root
    placeAt: "${contentPath}"
    modType: dawnwalker-pakalt

  # --- Priority 28: A Paks/ folder bundled in the archive (not ~mods) → Content/Paks ---
  - id: pak-alt
    priority: 28
    when:
      all:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Paks/**" }
    unless:
      any:
        - { hasFile: "**/~mods/**" }
        - { hasFile: "**/LogicMods/**" }
        - { hasFile: "**/Dawnwalker/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
    anchor: "**/Paks/"
    take: self
    placeAt: "${contentPath}"
    modType: dawnwalker-pakalt

  # --- Priority 29: IO Store mod (utoc/ucas without a .pak) → ~mods ---
  # UE5 defaults to IoStore, so utoc/ucas-only mods are expected here. A mod carrying BOTH a
  # .pak and a .utoc routes to `pak` (30) instead, because this rule's `unless: **/*.pak` excludes
  # it, which keeps the triplet together. tests.cases pins that ordering.
  - id: pak-iostore
    priority: 29
    when: { hasFile: "**/*.utoc" }
    unless:
      any:
        - { hasFile: "**/*.pak" }
        - { hasFile: "**/Dawnwalker/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.utoc"
    take: parent
    placeAt: "${pakModsPath}"
    modType: dawnwalker-pak

  # --- Priority 30: Default pak mod → flatten into ~mods ---
  - id: pak
    priority: 30
    when: { hasFile: "**/*.pak" }
    unless:
      any:
        - { hasFile: "**/Dawnwalker/**" }
        - { hasFile: "**/Engine/**" }
        - { hasFile: "**/Binaries/**" }
        - { hasFile: "**/Paks/**" }
        - { hasFile: "**/LogicMods/**" }
    anchor: "**/*.pak"
    take: parent
    placeAt: "${pakModsPath}"
    modType: dawnwalker-pak

setup:
  ensureDirs:
    - ${pakModsPath}
    # UE only creates the user-config dir on first launch, and this game ships no Engine.ini
    # (confirmed: the leaf holds GameUserSettings.ini and GameUserFramegen.ini only).
    # Deploying a config mod before first launch would hit a missing target, the
    # "Deployment target unknown" failure fixed for games/paralives in 1.3.1.
    - ${configPath}
    # UE4SS Lua mods deploy here but nothing creates it: the game ships no
    # Binaries/<arch>/ue4ss, and UE4SS only creates Mods/ once its loader is installed.
    # The loader is still required; this only stops the deploy failing.
    - ${ue4ssModsPath}

toolbarActions:
  - id: open-ue4ss-settings
    title: Open UE4SS Settings INI
    priority: 200
    target: { openFile: "${ue4ssRootPath}/UE4SS-settings.ini" }

  - id: open-nexus-page
    title: Open Nexus Page
    priority: 201
    target: { openUrl: "https://www.nexusmods.com/thebloodofdawnwalker" }

nexus:
  modId: 2248            # nexusmods.com/site/mods/2248 (the Vortex extension page)
  # Confirmed present via v1 (/games/site/mods/2248.json → mod_id 2248, game_id 2295,
  # created 2026-09-01). The page is status "not_published" / available: false, which is
  # expected for an unreleased extension. It does not block building or packaging, only
  # publishing.
  fileGroupId: 7894857
  # fileGroupId is NOT verifiable through the v1 API while the page is unpublished
  # (/files.json returns 403 "Mod not available: 2248"), so this value was supplied by the
  # maintainer from the Nexus upload page, the route recipe §4 prescribes. Re-check it
  # against the upload page if publishing ever 404s on the file group.
  displayName: The Blood of Dawnwalker Support for Vortex

# ---------------------------------------------------------------------------------------
# CORPUS STATE (2026-09-03, midday): 41 matched, 2 unmatched, 0 failed, 43 total, with 28
# validators passing and none failing. The catalogue went 1 -> 34 -> 43 mods in a day.
#
# Category spread, the useful signal for anyone changing the ladder:
#   root ............... 16     content-relative ...  3
#   pak ................  8     ue4ss-lua ..........  2
#   config-ini .........  6     content-folder .....  1
#   native-dll .........  4     ue4ss-injector .....  1
#   reshade ............  1
#
# What this catalogue settled that no template could:
#   * Game-relative archives dominate, and many write straight into Content/Paks/~mods,
#     which is good evidence that ~mods mounts.
#   * Content-relative archives exist (Paks/ and Movies/ siblings at the archive root).
#     pak-alt anchored on Paks/ and silently dropped the siblings, costing mod 9 its
#     subtitle file. Hence content-relative (27.5).
#   * A bare .addon64 ReShade addon ships with no .dll beside it (mod 37), so native-dll
#     matches the extension directly rather than relying on a dll to anchor it.
#
# Two mods are unmatched DELIBERATELY, both legitimate per docs/corpus-manifests.md:
#   mod 43  DawnwalkerSaveEditor.exe, a standalone tool rather than a deployable payload.
#   mod 54  Dawnwalker_ja/*.bat, scripts the user runs, not files the game loads.
# Neither should be forced into a modType: deploying them would look like success while
# achieving nothing.
#
# mod 59 ships the SAME pak twice, correctly under Dawnwalker/Content/Paks/~mods and again
# loose at the archive root. `root` deploys that verbatim, which is right, and
# pak-payload-placement is narrowed to skip that shape rather than sit permanently red. See
# the comment on that validator.
#
# mod 22 routes via ue4ss-injector on its dwmapi.dll even though it is not UE4SS. The
# destination is right, so only the modType LABEL reads oddly. Do not rename the id: ids
# are permanent once published.
#
# Running it: --fetch does NOT work for this game. Manifests 404 on the UUID-style file
# uris (the outage in docs/corpus-manifests.md), and the run then prints "nothing to do"
# and EXITS 0 with Nx reporting success. Use the listing tool, and put 7-Zip on PATH first
# or .rar/.7z archives are skipped, which hid 3 mods on the first pass:
#     export PATH="/c/Program Files/7-Zip:$PATH"
#     node tools/corpus/list-archive.mjs --domain thebloodofdawnwalker --game-id 9719
#         --all --out games/thebloodofdawnwalker/tests/cache
#     pnpm nx run thebloodofdawnwalker:test-corpus        # note: NO --fetch
# Reconcile `T total` against `mods` from
# https://api.nexusmods.com/v1/games/thebloodofdawnwalker.json. That count LAGS
# publication, so cross-check latest_added for available:true. ALWAYS clear the cache
# first: it is keyed by file id, so an updated mod leaves the old entry behind and the
# totals silently inflate (43 mods read as 50 before a clear).
#
# A `matched` line is NOT proof of correct routing, and mod 9 proves it: it reported
# matched while losing a file. Compare each archive's entry count against its routed file
# count, and spot-check destinations against the mod's own instructions.
# ---------------------------------------------------------------------------------------

# Corpus validators: checked against real Nexus archives by the corpus run. Only
# reshade-validator has fired so far (mod 4). The rest encode the intended routing so a
# future rule change cannot regress it unnoticed.
validators:
  - id: injector-validator
    name: UE4SS loader archives (dwmapi/xinput/UE4SS-settings.ini) match ue4ss-injector
    # Game-relative loader bundles are claimed by `root` by design (installer 15), so they
    # are excluded here; pak-payload-placement covers their payload instead.
    when:
      all:
        - { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "Dawnwalker/**" }
        - not: { hasFile: "Engine/**" }
    assert: { matched: ue4ss-injector }

  - id: reshade-validator
    name: ReShade presets (ReShade.ini, no loader) match reshade
    when:
      all:
        - { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
    assert: { matched: reshade }

  - id: reshade-preset-validator
    name: Bare preset .ini archives (no Engine.ini, no payload) match reshade-preset
    when:
      all:
        - { hasFile: "**/*.ini" }
        - not: { hasFile: "**/{Engine.ini,engine.ini,Game.ini,game.ini,GameUserSettings.ini,gameusersettings.ini,GameUserFramegen.ini,gameuserframegen.ini,Input.ini,input.ini,Scalability.ini,scalability.ini}" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/ReShade.ini" }
        - not: { hasFile: "**/*.pak" }
        - not: { hasFile: "**/*.utoc" }
        - not: { hasFile: "**/*.dll" }
        - not: { hasFile: "**/*.lua" }
        - not: { hasFile: "**/Dawnwalker/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "**/Binaries/**" }
    assert: { matched: reshade-preset }

  - id: logicmods-validator
    name: LogicMods paks (not loader / game- or project-relative trees) match logicmods
    # The not-arms exclude shapes that HIGHER-priority installers legitimately claim ahead
    # of logicmods (20): the UE4SS loader (15), game-relative trees via root (16), wrapped
    # trees via wrapped-root (16.5), where `**/Dawnwalker/**` covers the root-level form too,
    # and project-relative trees via content-folder (17). Without them this validator would
    # false-fail on a correctly routed Dawnwalker/Content/Paks/LogicMods/… archive.
    when:
      all:
        - { hasFile: "**/LogicMods/**/*.pak" }
        - not: { hasFile: "**/{dwmapi.dll,xinput1_3.dll,xinput1_4.dll,UE4SS-settings.ini}" }
        - not: { hasFile: "**/Dawnwalker/**" }
        - not: { hasFile: "**/Engine/**" }
        - not: { hasFile: "Content/**" }
        - not: { hasFile: "Config/**" }
        - not: { hasFile: "Binaries/**" }
    assert: { matched: logicmods }

  - id: config-validator
    name: Bare Engine.ini archives (no payload) match config-ini
    when:
      all:
        - { hasFile: "**/{Engine.ini,engine.ini}" }
        - not: { hasFile: "**/*.pak" }
        - not: { hasFile: "**/*.utoc" }
        - not: { hasFile: "**/*.dll" }
        - not: { hasFile: "**/*.lua" }
        - not: { hasFile: "Dawnwalker/**" }
        - not: { hasFile: "Engine/**" }
    assert: { matched: config-ini }

  # Placement guard: regardless of which pak installer wins, IoStore pak payloads must land
  # under Content/Paks and never loose at the game-folder root (a .ucas at the root is
  # silently ignored by UE and is a common mis-route). This also catches a payload class
  # vanishing from the plan entirely, which is how the halocampaignevolved mod-68
  # pak-dropping bug surfaced.
  # Skips game-relative archives that ALSO carry a loose pak at their own root. Real mod 59
  # ships the same pak twice, once correctly under Dawnwalker/Content/Paks/~mods and once
  # bare at the archive root. `root` deploys that verbatim, which is correct: the placed copy
  # works and the stray one is inert, because UE ignores a loose pak at the install root.
  # The assertion cannot tell that shape from a real mis-route, and leaving it red would
  # train people to ignore validator failures. Narrowed rather than deleted, so a pak that
  # lands ONLY at the root is still caught.
  - id: pak-payload-placement
    name: .pak/.ucas/.utoc install under Content/Paks, never at the game root
    when:
      all:
        - { hasFile: "**/*.{pak,ucas,utoc}" }
        - not:
            all:
              - { hasFile: "Dawnwalker/**" }
              - { hasFile: "*.pak" }
    assert:
      placement:
        - files: "**/*.{pak,ucas,utoc}"
          mustMatch: "**/Content/Paks/**"
          mustNotMatch: "${installPath}/*"

tests:
  corpus: nexus
  # EVERY case below is SYNTHETIC. The game has no published mods (see the CORPUS STATE note
  # above), so unlike starwarszerocompany or solarpunk there is not a single verbatim corpus
  # listing here to mark REAL SHAPE. The shapes are borrowed from real mods on the other UE5
  # games in this repo (halocampaignevolved, starwarszerocompany, solarpunk), and the
  # comment on each says which. They verify rule WIRING (priority ordering, unless-guards,
  # path flattening), which is genuinely worth pinning, but they are NOT evidence that this
  # game's mods look like this. Replace them with real listings as mods appear.
  cases:
    # Shape from starwarszerocompany mod 9 / solarpunk mod 4: the stock UE4SS bundle, a
    # dwmapi.dll proxy at the archive root next to a ue4ss/ tree. The whole tree must land
    # in Binaries/, including the nested Mods/*/Scripts/*.lua, rather than ue4ss-lua (22)
    # claiming the lua and dropping the loader.
    - name: "ue4ss-injector: stock UE4SS bundle into Binaries"
      archive:
        - dwmapi.dll
        - README.txt
        - ue4ss/UE4SS.dll
        - ue4ss/UE4SS-settings.ini
        - ue4ss/Mods/mods.txt
        - ue4ss/Mods/BPModLoaderMod/Scripts/main.lua
      expect:
        matched: ue4ss-injector
        modType: dawnwalker-ue4ss-injector
        plan:
          - ${binariesPath}/dwmapi.dll
          - ${binariesPath}/README.txt
          - ${binariesPath}/ue4ss/UE4SS.dll
          - ${binariesPath}/ue4ss/UE4SS-settings.ini
          - ${binariesPath}/ue4ss/Mods/mods.txt
          - ${binariesPath}/ue4ss/Mods/BPModLoaderMod/Scripts/main.lua

    # Shape from starwarszerocompany mods 2 and 7 ("Faster Loading", "Lossless Engine
    # Tweaks"), both a lone Engine.ini at the archive root. Two of that game's six day-one
    # mods were this shape, and five of halocampaignevolved's 38. A pak-only template
    # drops them all.
    - name: "config-ini: bare Engine.ini to the user config dir"
      archive:
        - Engine.ini
      expect:
        matched: config-ini
        modType: dawnwalker-config
        plan:
          - ${configPath}/Engine.ini

    # Shape from starwarszerocompany mod 16 ("Force PS5 controller icons"): a bare lowercase
    # `game.ini`, whose author's instructions say to drop it in the user config dir, NOT
    # Binaries. This case exists because reshade-preset (19.5) originally swallowed it on
    # that game (any bare .ini looks like a preset) and shipped mis-routed in 1.0.0.
    # It pins that config-ini (19) wins. Both rules' brace lists must keep agreeing.
    - name: "config-ini: bare lowercase game.ini beats reshade-preset"
      archive:
        - game.ini
      expect:
        matched: config-ini
        modType: dawnwalker-config
        plan:
          - ${configPath}/game.ini

    # GameUserFramegen.ini is specific to this game: it sits next to GameUserSettings.ini in
    # the user config dir on a real install. Without it in the brace lists a mod shipping a
    # preconfigured one falls through to reshade-preset (19.5) and lands in Binaries.
    - name: "config-ini: GameUserFramegen.ini to the user config dir"
      archive:
        - GameUserFramegen.ini
      expect:
        matched: config-ini
        modType: dawnwalker-config
        plan:
          - ${configPath}/GameUserFramegen.ini

    # GUARD CASE for config-ini's `unless` arms. A mod bundling a config tweak ALONGSIDE a
    # pak must keep its pak routing and deploy the pak, not be reduced to a config drop.
    # Delete the `**/*.pak` arm from config-ini (19) and this case fails.
    #
    # The Engine.ini rides along into ~mods because `pak` anchors the .pak and takes its
    # PARENT folder, flattening everything in it. That is a known wart, not a bug being
    # papered over: the alternative (config-ini claiming the archive) drops the pak
    # entirely, which is far worse. UE ignores a stray .ini in ~mods, so the file is inert
    # and the user can move it by hand. Same outcome as starwarszerocompany's equivalent
    # case. If a real mod ever ships this shape it deserves a proper look.
    - name: "config-ini guard: Engine.ini bundled with a pak keeps pak routing"
      archive:
        - MyMod/Engine.ini
        - MyMod/MyMod_P.pak
      expect:
        matched: pak
        modType: dawnwalker-pak
        plan:
          - ${pakModsPath}/MyMod_P.pak
          - ${pakModsPath}/Engine.ini

    # Shape from starwarszerocompany mod 12 ("Zero Company Reshade"): a lone preset .ini
    # named after itself, NOT ReShade.ini, so the `reshade` rule (18) misses it. This is
    # what reshade-preset (19.5) exists for.
    - name: "reshade-preset: bare preset ini into Binaries"
      archive:
        - DawnwalkerCinematicPreset.ini
      expect:
        matched: reshade-preset
        modType: dawnwalker-binaries
        plan:
          - ${binariesPath}/DawnwalkerCinematicPreset.ini

    # REAL SHAPE, and the first mod published for this game: mod 4 "Ultra Realistica
    # ReShade" by Tobkes. Verbatim listing from the corpus: ReShade.ini plus the named
    # preset, both at the archive root with no wrapping folder, so nothing is stripped.
    # Destination checked against the author's own instructions, which tell users to point
    # ReShade at ...\The Blood of Dawnwalker\Dawnwalker\Binaries\Win64 and drop the preset
    # beside Dawnwalker.exe. That is binariesPath.
    - name: "reshade: real mod 4, ReShade.ini + preset at archive root"
      archive:
        - ReShade.ini
        - Ultra Realistica ReShade.ini
      expect:
        matched: reshade
        modType: dawnwalker-binaries
        plan:
          - ${binariesPath}/ReShade.ini
          - ${binariesPath}/Ultra Realistica ReShade.ini

    # Shape from solarpunk mod 1 (WarmSun): a preset folder carrying the literal ReShade.ini
    # plus shaders. The wrapping folder is stripped and the tree lands in Binaries/.
    - name: "reshade: preset folder stripped into Binaries"
      archive:
        - CoolPreset/ReShade.ini
        - CoolPreset/CoolPreset.ini
        - CoolPreset/reshade-shaders/Shaders/Clarity.fx
      expect:
        matched: reshade
        modType: dawnwalker-binaries
        plan:
          - ${binariesPath}/ReShade.ini
          - ${binariesPath}/CoolPreset.ini
          - ${binariesPath}/reshade-shaders/Shaders/Clarity.fx

    # REAL SHAPE, real mod 37 "BoDw RenoDX UE-Extended": a lone .addon64 with no .dll beside
    # it. Matched nothing before native-dll's `when` and anchor covered the extension.
    - name: "native-dll: real mod 37, bare .addon64 with no dll"
      archive:
        - renodx-ue-extended.addon64
      expect:
        matched: native-dll
        modType: dawnwalker-binaries
        plan:
          - ${binariesPath}/renodx-ue-extended.addon64

    # Shape from solarpunk mod 5 (AirshipShare): a single loose plugin dll.
    - name: "native-dll: bare dll placed in Binaries"
      archive:
        - SomePlugin.dll
      expect:
        matched: native-dll
        modType: dawnwalker-binaries
        plan:
          - ${binariesPath}/SomePlugin.dll

    - name: "ue4ss-lua: lua mod with Scripts folder"
      archive:
        - MyMod/Scripts/main.lua
        - MyMod/enabled.txt
      expect:
        matched: ue4ss-lua
        modType: dawnwalker-ue4ss
        plan:
          - ${ue4ssModsPath}/MyMod/Scripts/main.lua
          - ${ue4ssModsPath}/MyMod/enabled.txt

    - name: "logicmods: paks under LogicMods/ folder"
      archive:
        - Pack/LogicMods/BPFolder/X.pak
      expect:
        matched: logicmods
        modType: dawnwalker-logicmods
        plan:
          - ${paksPath}/LogicMods/BPFolder/X.pak

    - name: "pak: single pak file flattened to ~mods"
      archive:
        - SomeMod/Cool.pak
      expect:
        matched: pak
        modType: dawnwalker-pak
        plan:
          - ${pakModsPath}/Cool.pak

    # Shape from solarpunk mod 3 ("Better Stacks"): a .pak alongside .utoc/.ucas must route
    # to `pak` (30), NOT pak-iostore (29) whose `unless: **/*.pak` excludes it, so the
    # triplet stays together. Pins that ordering.
    - name: "pak: pak+ucas+utoc triplet, pak wins over pak-iostore"
      archive:
        - SomeMod/files/x_P.pak
        - SomeMod/files/x_P.ucas
        - SomeMod/files/x_P.utoc
      expect:
        matched: pak
        modType: dawnwalker-pak
        plan:
          - ${pakModsPath}/x_P.pak
          - ${pakModsPath}/x_P.ucas
          - ${pakModsPath}/x_P.utoc

    - name: "pak-iostore: utoc+ucas without a pak"
      archive:
        - SomeMod/x_P.utoc
        - SomeMod/x_P.ucas
      expect:
        matched: pak-iostore
        modType: dawnwalker-pak
        plan:
          - ${pakModsPath}/x_P.utoc
          - ${pakModsPath}/x_P.ucas

    # REAL SHAPE, real mod 9 "The Blood of Dawnwalker Thailocalization". A Content-relative
    # tree: Movies/ and Paks/ as siblings at the archive root. Under pak-alt this routed as
    # 3 files and the .srt was SILENTLY DROPPED, because anchoring on Paks/ discards
    # everything outside it. All four files must survive.
    - name: "content-relative: real mod 9, Movies/ sibling survives alongside Paks/"
      archive:
        - Movies/intro_cgi_en.srt
        - Paks/Dawnwalker-Windows_P.pak
        - Paks/Dawnwalker-Windows_P.ucas
        - Paks/Dawnwalker-Windows_P.utoc
      expect:
        matched: content-relative
        modType: dawnwalker-pakalt
        plan:
          - ${contentPath}/Movies/intro_cgi_en.srt
          - ${contentPath}/Paks/Dawnwalker-Windows_P.pak
          - ${contentPath}/Paks/Dawnwalker-Windows_P.ucas
          - ${contentPath}/Paks/Dawnwalker-Windows_P.utoc

    # REAL SHAPE, real mod 24 "Splash". Matched nothing before content-relative existed.
    # UE reads the splash image from <Project>/Content/Splash.
    - name: "content-relative: real mod 24, bare Splash/Splash.bmp"
      archive:
        - Splash/Splash.bmp
      expect:
        matched: content-relative
        modType: dawnwalker-pakalt
        plan:
          - ${contentPath}/Splash/Splash.bmp

    # GUARD CASE. content-relative (27.5) anchors its `when` at the archive root, so a
    # NESTED Paks/ must still fall through to pak-alt (28). Drop the root anchoring and
    # this case changes installer.
    - name: "pak-alt: bundled Paks/ folder → Content/Paks"
      archive:
        - mod/Paks/sub/x.pak
        - mod/Paks/sub/x.ucas
        - mod/Paks/sub/x.utoc
      expect:
        matched: pak-alt
        modType: dawnwalker-pakalt
        plan:
          - ${contentPath}/Paks/sub/x.pak
          - ${contentPath}/Paks/sub/x.ucas
          - ${contentPath}/Paks/sub/x.utoc

    - name: "content-folder: Content/ at archive root"
      archive:
        - Content/Foo.uasset
        - Content/Bar.uexp
      expect:
        matched: content-folder
        modType: dawnwalker-contentfolder
        plan:
          - ${gamePath}/Content/Foo.uasset
          - ${gamePath}/Content/Bar.uexp

    # Shape from starwarszerocompany mod 1: a startup-movie replacement laid out from the
    # install root. Media-replacement mods are a real day-one category (that game's very
    # first mod was one), and the game-relative tree means `root` (16) deploys it intact.
    - name: "root: game-relative movie replacement deploys verbatim"
      archive:
        - Dawnwalker/Content/Movies/Logo_Startup.mp4
        - Dawnwalker/Content/Movies/Logo_Startup.bk2
      expect:
        matched: root
        modType: dawnwalker-root
        plan:
          - ${installPath}/Dawnwalker/Content/Movies/Logo_Startup.mp4
          - ${installPath}/Dawnwalker/Content/Movies/Logo_Startup.bk2

    # GUARD CASE. A single archive laid out from the install root carrying BOTH a UE4SS Lua
    # payload and a pak must deploy as one intact tree.
    # The arm actually exercised here is `root`'s `when.any: hasFile "Dawnwalker/**"` (16):
    # ue4ss-injector (15) never fires on this archive because there is no loader dll in it.
    # Remove that arm and ue4ss-lua (22) claims the archive instead, scoping `take:
    # parent.parent` to the Foo subtree and silently dropping the pak: the
    # halocampaignevolved mod-68 bug. ue4ss-injector's own `Dawnwalker/**` guard covers the
    # variant of this shape that DOES ship a loader.
    - name: "root: mixed lua+pak game-relative archive keeps paks"
      archive:
        - Dawnwalker/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
        - Dawnwalker/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
        - Dawnwalker/Content/Paks/~mods/Foo_P.pak
      expect:
        matched: root
        modType: dawnwalker-root
        plan:
          - ${installPath}/Dawnwalker/Binaries/Win64/ue4ss/Mods/Foo/Scripts/main.lua
          - ${installPath}/Dawnwalker/Binaries/Win64/ue4ss/Mods/Foo/enabled.txt
          - ${installPath}/Dawnwalker/Content/Paks/~mods/Foo_P.pak

    # GUARD CASE for wrapped-root (16.5). The same game-relative tree wrapped in a folder
    # named after the mod. Without this rule `root` (16) anchors at the archive root, matches
    # nothing, and the mod installs ZERO files silently, which hit six halocampaignevolved
    # mods. stripCommonRoot keeps the wrapped README too.
    #
    # Note the plan is modType-RELATIVE, unlike every anchor/placeAt case above: a `copy:`
    # rule emits paths relative to the modType's own path (dawnwalker-root → ${installPath}),
    # so prefixing them with ${installPath} here fails. Same convention as
    # starwarszerocompany's two wrapped-root cases.
    - name: "wrapped-root: folder-wrapped game-relative tree still deploys"
      archive:
        - My Cool Mod/Dawnwalker/Content/Paks/~mods/Cool_P.pak
        - My Cool Mod/README.txt
      expect:
        matched: wrapped-root
        modType: dawnwalker-root
        plan:
          - Dawnwalker/Content/Paks/~mods/Cool_P.pak
          - README.txt
